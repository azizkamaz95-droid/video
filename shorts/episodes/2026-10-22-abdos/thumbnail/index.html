      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFC93C; }

      .k { font-family: "Caveat", cursive; font-weight: 700; color: #141414; line-height: .95; white-space: nowrap; }
      .brand { position: absolute; left: 0; width: 1080px; top: 120px; display: flex; justify-content: center; align-items: center; gap: 16px; }
      .brand img { width: 70px; height: 70px; border-radius: 16px; box-shadow: 0 8px 18px rgba(0,0,0,.18); }
      .brand span { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 50px; letter-spacing: -.02em; color: #141414; }

    <script>
      (function () {
        const build = () => {
          document.querySelectorAll("[data-fit]").forEach((el) => {
            const cs = getComputedStyle(el);
            el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent, { maxWidth: +el.dataset.fit, fontFamily: "Montserrat", fontWeight: 900, baseFontSize: parseFloat(cs.fontSize), minFontSize: 60, step: 2 }).fontSize + "px";
          });
          // hand-drawn tally groups next to Calix
          const svg = document.getElementById("b-tally");
          for (let g = 0; g < 4; g++) {
            const cx = (g % 2) * 126 + 4, cy = Math.floor(g / 2) * 98 + 4;
            const j = (k) => ((g * 37 + k * 13) % 9) - 4;
            const d = [0, 1, 2, 3].map((k) => `M${cx + 12 + k * 22 + j(k)} ${cy + 6} L${cx + 14 + k * 22 - j(k + 1)} ${cy + 80}`).join(" ") + ` M${cx} ${cy + 66 + j(5)} L${cx + 100} ${cy + 14 + j(6)}`;
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", d); p.setAttribute("class", "doodle"); p.setAttribute("style", "stroke-width:8");
            svg.appendChild(p);
          }
          const tl = gsap.timeline({ paused: true });
          tl.set("#vA", { opacity: 1 }, 0);
          tl.set("#vA", { opacity: 0 }, 1);
          tl.set("#vB", { opacity: 1 }, 1);
          window.__timelines["main"] = tl;
        };
        document.fonts.ready.then(build);
      })();
    </script>
