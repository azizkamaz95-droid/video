      <div id="root" data-composition-id="f02-milliers" data-width="1080" data-height="1920" data-duration="2.9">
        <div class="scene" id="f02">

            <div id="f02-l1" class="h2">Même des</div>
            <div id="f02-l2" class="h1"><span class="mk" id="f02-mk"><i></i><span>milliers</span></span></div>

      <script>
        (function () {
          const ID = "f02-milliers", at = K3.T(4.30);
          const build = () => {
            const R = document.getElementById("f02");
            K3.fit(R);
            // 24 hand-drawn tally groups (deterministic jitter)
            const svg = document.getElementById("f02-tally");
            const groups = [];
            for (let g = 0; g < 24; g++) {
              const cx = (g % 6) * 156 + 8, cy = Math.floor(g / 6) * 104 + 6;
              const j = (k) => ((g * 37 + k * 13) % 9) - 4;
              const d = [0, 1, 2, 3].map((k) => `M${cx + 12 + k * 26 + j(k)} ${cy + 8} L${cx + 14 + k * 26 - j(k + 1)} ${cy + 86}`).join(" ") + ` M${cx} ${cy + 72 + j(5)} L${cx + 112} ${cy + 16 + j(6)}`;
              const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
              p.setAttribute("d", d);
              p.setAttribute("class", "doodle");
              p.setAttribute("style", "stroke-width:7");
              svg.appendChild(p);
              groups.push(p);
            }
            const tl = gsap.timeline({ paused: true });
            K3.enter(tl, at, "#f02", 4.30);
            K3.words(tl, at, document.getElementById("f02-l1"), [4.49, 4.65]);
            K3.slam(tl, at, "#f02-l2", 4.72, { from: 2.2, r: -3 });
            K3.marker(tl, at, "#f02-mk", 4.86, 0.2);
            K3.words(tl, at, document.getElementById("f02-l3"), [5.13]);
            groups.forEach((p, g) => K3.draw(tl, at, p, 4.85 + g * 0.045, 0.16, "none"));
            // everything clears, the promise lands
            tl.fromTo("#f02-a", { y: 0, opacity: 1 }, { y: -500, opacity: 0, duration: 0.24, ease: "power3.in", immediateRender: false }, at(5.92));
            K3.words(tl, at, document.getElementById("f02-b1"), [6.03, 6.10, 6.21, 6.34, 6.42]);
            K3.slam(tl, at, "#f02-b2", 6.42, { from: 2.4, r: -3 });
            K3.marker(tl, at, "#f02-mk2", 6.58, 0.18);
            K3.draw(tl, at, "#f02-arp", 6.7, 0.3);
            K3.write(tl, at, "#f02-note", 6.66, 0.3);
            K3.exit(tl, at, "#f02", 6.98);
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
