      <script>
        (function () {
          const ID = "f08-jambe", at = K3.T(27.80);
          const build = () => {
            const R = document.getElementById("f08");
            K3.fit(R);
            const tl = gsap.timeline({ paused: true });
            K3.enter(tl, at, "#f08", 27.80);
            // « Une autre étude a fait travailler une seule jambe pendant douze semaines. »
            K3.drop(tl, at, "#f08-card", 27.92, 0);
            K3.write(tl, at, "#f08-who", 28.3, 0.5);
            K3.write(tl, at, "#f08-src", 28.6, 0.6);
            tl.fromTo("#f08-legs", { y: 700, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "back.out(1.3)" }, at(28.6));
            tl.fromTo("#f08-hot", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at(29.24));
            tl.fromTo("#f08-lR", { scale: 1, svgOrigin: "300 320" }, { scale: 1.08, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(29.24));
            K3.draw(tl, at, "#f08-arr", 29.3, 0.25);
            K3.write(tl, at, "#f08-one", 29.4, 0.4);
            K3.pop(tl, at, "#f08-wk", 29.96, { from: 0.3, r0: -10, r: 3 });
            // « Jusqu'à 1 200 répétitions par séance. » : the trained leg pumps
            K3.write(tl, at, "#f08-upto", 30.93, 0.35);
            tl.fromTo("#f08-num", { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, at(30.95));
            K3.count(tl, at, document.getElementById("f08-num"), 0, 1200, 30.98, 0.72);
            tl.fromTo("#f08-num", { scale: 1 }, { scale: 1.1, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(31.68));
            K3.words(tl, at, document.getElementById("f08-rep"), [31.92, 32.45, 32.56]);
            tl.fromTo("#f08-lR", { y: 0 }, { y: -26, duration: 0.17, ease: "sine.inOut", yoyo: true, repeat: 9, immediateRender: false }, at(31.0));
            // « La graisse de cette jambe ? » : column swap, push in on the leg
            tl.fromTo("#f08-colA", { y: 0, opacity: 1 }, { y: -160, opacity: 0, duration: 0.22, ease: "power3.in", immediateRender: false }, at(33.42));
            tl.fromTo(["#f08-one", "#f08-arr"], { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none", immediateRender: false }, at(33.42));
            K3.words(tl, at, document.getElementById("f08-q1"), [33.57, 33.65, 33.98]);
            K3.words(tl, at, document.getElementById("f08-q2"), [34.06, 34.30, 34.40]);
            tl.fromTo("#f08-legs", { scale: 1, transformOrigin: "70% 50%" }, { scale: 1.12, duration: 1.4, ease: "power2.inOut", immediateRender: false }, at(33.6));
            tl.fromTo("#f08-cellg", { scale: 0, opacity: 0, svgOrigin: "290 300" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, at(34.3));
            // « Aucun changement significatif. » : the fat cell shakes its head
            K3.slam(tl, at, "#f08-no", 35.28, { from: 2.4, r: -2 });
            K3.marker(tl, at, "#f08-mk", 35.4, 0.16);
            tl.fromTo("#f08-cellg", { x: 0 }, { x: 10, duration: 0.06, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, at(35.32));
            K3.words(tl, at, document.getElementById("f08-chg"), [35.5]);
            K3.write(tl, at, "#f08-sig", 35.9, 0.5);
            K3.exit(tl, at, "#f08", 36.7);
            window.__timelines[ID] = tl;
