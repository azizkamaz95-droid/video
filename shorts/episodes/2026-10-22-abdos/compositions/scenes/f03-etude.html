      <div id="root" data-composition-id="f03-etude" data-width="1080" data-height="1920" data-duration="5.12">
        <div class="scene" id="f03">
          <div class="paper" id="f03-card">
            <i class="tape"></i>
            <div id="f03-lab">ÉTUDE</div>
            <div id="f03-year" class="h1">1984</div>
            <div id="f03-note" class="hand">des chercheurs américains</div>
            <div id="f03-r1" class="h3">13 hommes</div>
            <svg id="f03-ppl" viewBox="0 0 840 84"></svg>
            <div id="f03-r2" class="h3">27 jours d'abdos</div>
            <svg id="f03-cal" viewBox="0 0 840 122"></svg>
            <div id="f03-src" class="foot">Source : Katch et al., Research Quarterly for Exercise and Sport, 1984</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f03-etude", at = K3.T(7.20);
          const NS = "http://www.w3.org/2000/svg";
          const build = () => {
            const ppl = document.getElementById("f03-ppl"), cal = document.getElementById("f03-cal");
            const men = [], cells = [];
            for (let i = 0; i < 13; i++) {
              const g = document.createElementNS(NS, "g");
              g.setAttribute("transform", `translate(${i * 64} 0)`);
              g.innerHTML = '<circle cx="27" cy="16" r="14" fill="#141414"/><path d="M4 84 C4 48 14 34 27 34 C40 34 50 48 50 84 Z" fill="#141414"/>';
              ppl.appendChild(g);
              men.push(g);
            }
            for (let i = 0; i < 27; i++) {
              const x = (i % 14) * 60, y = Math.floor(i / 14) * 62;
              const g = document.createElementNS(NS, "g");
              g.innerHTML = `<rect x="${x + 3}" y="${y + 3}" width="48" height="48" rx="8" fill="none" stroke="#141414" stroke-width="4"/>` +
                `<path class="ck" d="M${x + 12} ${y + 28} L${x + 23} ${y + 40} L${x + 42} ${y + 13}" fill="none" stroke="#E63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
              cal.appendChild(g);
              cells.push(g);
            }
            const tl = gsap.timeline({ paused: true });
            K3.drop(tl, at, "#f03-card", 7.22, -1.5);
            K3.slam(tl, at, "#f03-year", 7.42, { from: 2.2, r: 0 });
            K3.write(tl, at, "#f03-note", 8.75, 0.9);
            K3.write(tl, at, "#f03-src", 9.5, 0.6);
            // « treize hommes »
            K3.pop(tl, at, "#f03-r1", 10.2, { from: 0.6, r0: -4 });
            men.forEach((m, i) => tl.fromTo(m, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.18, ease: "back.out(2.6)" }, at(10.26 + i * 0.03)));
            // « vingt-sept jours » : the calendar gets ticked
            K3.pop(tl, at, "#f03-r2", 11.4, { from: 0.6, r0: -4 });
            cells.forEach((c, i) => {
              tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, at(11.42 + i * 0.006));
              K3.draw(tl, at, c.querySelector(".ck"), 11.52 + i * 0.016, 0.1, "none");
            });
            tl.fromTo("#f03-card", { scale: 1 }, { scale: 1.035, duration: 4.4, ease: "none", immediateRender: false }, at(7.7));
            K3.exit(tl, at, "#f03", 12.1);
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
