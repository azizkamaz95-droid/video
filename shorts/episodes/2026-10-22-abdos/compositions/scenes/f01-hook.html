      <div id="root" data-composition-id="f01-hook" data-width="1080" data-height="1920" data-duration="4.3">
        <div class="scene" id="f01">
          <div id="f01-a">
            <div id="f01-l1" class="h1" data-fit="940">Je parie que</div>
            <div id="f01-l2" class="h1" data-fit="940">tu ne savais pas</div>
            <svg id="f01-ul" viewBox="0 0 760 40"><path id="f01-ulp" class="doodle red" d="M8 26 C 180 12, 420 34, 750 14" /></svg>

          </div>

            <div id="f01-b1" class="h2">Faire des abdos…</div>
            <div id="f01-b2" class="h2">ne fait <span class="pas">pas</span> fondre</div>
            <div id="f01-b3" class="h3">la graisse de ton <span class="f01-circ">ventre<svg viewBox="0 0 240 110" preserveAspectRatio="none"><path id="f01-cp" class="doodle red" d="M30 70 C 10 30, 90 6, 160 12 C 230 18, 240 70, 190 92 C 140 112, 50 104, 26 76 C 16 60, 34 40, 60 34" /></svg></span></div>

      <script>
        (function () {
          const ID = "f01-hook", at = K3.T(0.0);
          const build = () => {
            const R = document.getElementById("f01");
            K3.fit(R);
            const tl = gsap.timeline({ paused: true });
            // « Je parie que tu ne savais pas ÇA. »
            K3.words(tl, at, document.getElementById("f01-l1"), [0.24, 0.32, 0.64]);
            K3.words(tl, at, document.getElementById("f01-l2"), [0.72, 0.83, 0.88, 1.12]);
            K3.draw(tl, at, "#f01-ulp", 1.12, 0.22);
            K3.slam(tl, at, "#f01-l3", 1.24, { from: 2.6, r: -4 });
            K3.marker(tl, at, "#f01-mk", 1.4, 0.18);
            K3.wobble(tl, at, "#f01-l3", 1.46, 2, 3);
            // the whole statement is thrown off the top
            tl.fromTo("#f01-a", { y: 0, opacity: 1 }, { y: -420, opacity: 0, duration: 0.24, ease: "power3.in", immediateRender: false }, at(1.78));
            // « Faire des abdos… ne fait pas fondre la graisse de ton ventre. »
            K3.words(tl, at, document.getElementById("f01-b1"), [1.92, 2.11, 2.26]);
            tl.fromTo("#f01-stk", { y: 700, rotation: 12, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, at(1.9));
            // Calix does crunches while the sentence runs
            tl.fromTo("#f01-stk", { rotation: 0 }, { rotation: -7, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, at(2.3));
            K3.write(tl, at, "#f01-reps", 2.4, 0.35);
            K3.words(tl, at, document.getElementById("f01-b2"), [2.56, 2.65, 2.81, 2.97]);
            K3.words(tl, at, document.getElementById("f01-b3"), [3.21, 3.29, 3.53, 3.61, 3.77]);
            K3.draw(tl, at, "#f01-cp", 3.82, 0.36);
            tl.fromTo("#f01-b", { scale: 1 }, { scale: 1.04, duration: 2.4, ease: "none" }, at(1.9));
            K3.exit(tl, at, "#f01", 4.06);
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
