      <div id="root" data-composition-id="f10-partout" data-width="1080" data-height="1920" data-duration="5.32">
        <div class="scene" id="f10">
          <svg id="f10-svg" viewBox="0 0 1080 1150">
            <g transform="translate(150 230) scale(2.3)"><g id="f10-body">
              <path d="M62 84 C 46 96, 40 130, 34 178" fill="none" stroke="#141414" stroke-width="22" stroke-linecap="round" />
              <path d="M138 84 C 154 96, 160 130, 166 178" fill="none" stroke="#141414" stroke-width="22" stroke-linecap="round" />

              <path d="M138 84 C 154 96, 160 130, 166 178" fill="none" stroke="#FFF2C4" stroke-width="13" stroke-linecap="round" />
              <path d="M74 178 L126 178 L130 284 C 130 292, 112 292, 112 284 L 102 206 L 98 206 L 88 284 C 88 292, 70 292, 70 284 Z" fill="#FFF2C4" stroke="#141414" stroke-width="4" stroke-linejoin="round" />

              <path d="M840 300 C 880 360, 940 400, 920 480 C 905 540, 862 566, 836 566 C 790 566, 746 532, 752 476 C 758 430, 792 414, 800 372 C 818 404, 822 424, 840 432 C 850 390, 846 346, 840 300 Z" fill="#FF7A59" stroke="#141414" stroke-width="7" stroke-linejoin="round" />

          <div id="f10-tag" class="tag">schéma simplifié</div>
          <div id="f10-burn" class="hand">ça brûle…</div>
          <div id="f10-big" class="h1" data-fit="960"><span class="w">DE </span><span class="mk" id="f10-mk"><i></i><span>PARTOUT.</span></span></div>

      <script>
        (function () {
          const ID = "f10-partout", at = K3.T(40.42);
          const NS = "http://www.w3.org/2000/svg";
          // fat reserves (body coords, 200x300 box) -> screen: x*2.3+150, y*2.3+230
          const SPOTS = [[100, 150], [82, 104], [118, 104], [40, 128], [160, 128], [66, 166], [134, 166], [86, 236], [114, 236], [100, 196]];
          const FL = [836, 470];
          const build = () => {
            const bl = document.getElementById("f10-blobs"), dl = document.getElementById("f10-dots");
            const blobs = [], dots = [];
            SPOTS.forEach(([x, y], i) => {
              const cx = x * 2.3 + 150, cy = y * 2.3 + 230;
              const g = document.createElementNS(NS, "g");
              g.innerHTML = `<circle cx="${cx}" cy="${cy}" r="22" fill="#FFD66B" stroke="#141414" stroke-width="5"/><circle cx="${cx - 7}" cy="${cy - 7}" r="5" fill="#fff6d6"/>`;
              bl.appendChild(g);
              blobs.push({ g, cx, cy });
              for (let k = 0; k < 2; k++) {
                const d = document.createElementNS(NS, "circle");
                d.setAttribute("cx", cx); d.setAttribute("cy", cy); d.setAttribute("r", "9");
                d.setAttribute("fill", "#FFD66B"); d.setAttribute("stroke", "#141414"); d.setAttribute("stroke-width", "3");
                dl.appendChild(d);
                dots.push({ d, cx, cy, i, k });
              }
            });
            const R = document.getElementById("f10");
            K3.fit(R);
            const tl = gsap.timeline({ paused: true });
            K3.enter(tl, at, "#f10", 40.42);
            tl.fromTo("#f10-body", { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.3)" }, at(40.5));
            blobs.forEach((b, i) => tl.fromTo(b.g, { scale: 0, svgOrigin: `${b.cx} ${b.cy}` }, { scale: 1, duration: 0.22, ease: "back.out(2.6)" }, at(40.7 + i * 0.03)));
            // « Quand ton corps brûle de la graisse »
            tl.fromTo("#f10-flame", { scale: 0, svgOrigin: "836 566" }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, at(41.04));
            tl.fromTo("#f10-flame", { scaleY: 1 }, { scaleY: 1.07, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 25, immediateRender: false }, at(41.36));
            K3.write(tl, at, "#f10-burn", 41.3, 0.4);
            K3.write(tl, at, "#f10-tag", 41.6, 0.4);
            // « il puise dans tes réserves de partout » : every reserve feeds the flame
            dots.forEach(({ d, cx, cy, i, k }) => {
              const t = 42.33 + i * 0.07 + k * 0.42;
              tl.fromTo(d, { x: 0, y: 0, opacity: 0, scale: 1 }, { x: FL[0] - cx, y: FL[1] - cy, opacity: 1, scale: 0.5, duration: 0.5, ease: "power2.in", immediateRender: true }, at(t));
              tl.fromTo(d, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, at(t + 0.5));
            });
            blobs.forEach((b) => tl.fromTo(b.g, { scale: 1 }, { scale: 0.68, duration: 0.4, ease: "back.out(2)", immediateRender: false, svgOrigin: `${b.cx} ${b.cy}` }, at(43.21)));
            K3.slam(tl, at, "#f10-big", 43.21, { from: 2.4, r: -2 });
            K3.marker(tl, at, "#f10-mk", 43.32, 0.16);
            // « Pas forcément là où tu forces. »
            K3.draw(tl, at, "#f10-circ", 44.17, 0.35);
            K3.draw(tl, at, "#f10-arr", 44.3, 0.25);
            K3.write(tl, at, "#f10-note", 44.28, 0.8);
            K3.exit(tl, at, "#f10", 45.5);
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
