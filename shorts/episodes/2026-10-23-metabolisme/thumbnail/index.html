      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2B59C3; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #2B59C3; }
      .hf-font-a { font-family: "Montserrat"; font-weight: 900; } .hf-font-b { font-family: "Caveat"; font-weight: 700; }
      .v { position: absolute; inset: 0; opacity: 0; background: #2B59C3; }
      .grain { position: absolute; inset: 0; background: url(assets/fx/grain.png) repeat; background-size: 512px 512px; opacity: .09; mix-blend-mode: multiply; }
      .ghost { position: absolute; left: -60px; white-space: nowrap; font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 300px; letter-spacing: -.04em; color: rgba(255,255,255,.075); line-height: 1; }
      .m { font-family: "Montserrat", sans-serif; color: #fff; letter-spacing: -0.04em; line-height: .95; white-space: nowrap; font-weight: 900; }
      .k { font-family: "Caveat", cursive; font-weight: 700; line-height: .95; white-space: nowrap; }
      .brand { position: absolute; left: 0; width: 1080px; top: 120px; display: flex; justify-content: center; align-items: center; gap: 16px; }
      .brand img { width: 70px; height: 70px; border-radius: 16px; box-shadow: 0 8px 18px rgba(0,0,0,.25); }
      .brand span { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 50px; letter-spacing: -.02em; color: #fff; }
      .mk { position: relative; display: inline-block; padding: 0 .1em; }
      .mk > i { position: absolute; left: 0; right: 0; top: .04em; bottom: -.02em; border-radius: .06em; background: #FFC93C; }
      .mk > span { position: relative; color: #141414; }
      .lab { position: absolute; padding: .06em .24em .1em; border-radius: .12em; background: #FFC93C; color: #141414; font-family: "Montserrat", sans-serif; font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; box-shadow: 0 14px 30px rgba(0,0,0,.3); }
      .paper { position: absolute; background: #FFFDF6; border-radius: 12px; box-shadow: 0 22px 46px rgba(0,0,0,.3); }
      .tape { position: absolute; width: 150px; height: 44px; background: rgba(255,255,255,.65); border: 1px solid rgba(0,0,0,.06); }
      .stk { position: absolute; } .stk img { width: 100%; height: 100%; display: block; }

      #a-lab { left: 470px; top: 1150px; font-size: 104px; rotate: -4deg; }

      #vA .stk { left: -170px; top: 880px; width: 1040px; height: 1040px; }

        <div class="grain"></div>
      </div>

      <div class="v" id="vB">

        <div id="b1" class="m" data-fit="960">TON MÉTABOLISME</div>

        <div class="paper" id="b-card">

            <path d="M90 640 L930 640" stroke="#141414" stroke-width="5" fill="none" />
            
            <path fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M90 444 C 92 300, 95 228, 99 224 C 120 222, 150 330, 190 380 C 225 420, 250 444, 267 444 L 621 444 C 700 452, 830 515, 930 550" />
            <path fill="none" stroke="#2B59C3" stroke-width="20" stroke-linecap="round" d="M267 444 L621 444" />
          </svg>
        </div>
        <div class="lab" id="b-plate">PLATE.</div>
        <div class="stk"><img src="img/calix-pointe.png" alt="Calix montre du doigt" /></div>
        <div class="grain"></div>
      </div>
    </div>
    <script>
      (function () {
        const build = () => {
          document.querySelectorAll("[data-fit]").forEach((el) => {
            const cs = getComputedStyle(el);
            el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent, { maxWidth: +el.dataset.fit, fontFamily: "Montserrat", fontWeight: 900, baseFontSize: parseFloat(cs.fontSize), minFontSize: 60, step: 2 }).fontSize + "px";
          });
          const tl = gsap.timeline({ paused: true });
          tl.set("#vA", { opacity: 1 }, 0);
          tl.set("#vA", { opacity: 0 }, 1);
          tl.set("#vB", { opacity: 1 }, 1);
          window.__timelines["main"] = tl;
        };
        document.fonts.ready.then(build);
      })();
    </script>
