<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f16-btns { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .f16-btn { position: absolute; left: 70px; width: 820px; display: flex; align-items: center; gap: 28px; padding: 0 44px; border-radius: 80px; }
        .f16-btn svg { width: 86px; height: 86px; flex: none; }
        .f16-btn .disp { font-size: 116px; }
        #f16-b1 { top: 250px; height: 150px; background: #F4F1EC; box-shadow: 0 14px 0 #9a958c, 0 40px 80px rgba(0,0,0,.5); }
        #f16-b2 { top: 520px; height: 140px; background: #15151f; border: 5px solid #F4F1EC; box-shadow: 0 14px 0 #05050a, 0 40px 80px rgba(0,0,0,.5); }
        #f16-b3 { top: 780px; height: 150px; background: linear-gradient(90deg, #FF2D55, #FF6B35); box-shadow: 0 16px 0 #8a1c2f, 0 40px 80px rgba(255,60,70,.45); }
        .f16-who { position: absolute; left: 70px; font-size: 22px; letter-spacing: .08em; color: #cfcbd8; }
        #f16-w1 { top: 430px; } #f16-w2 { top: 690px; } #f16-w3 { top: 962px; color: var(--green); }
        .f16-heart { position: absolute; left: 150px; top: 300px; width: 44px; height: 44px; }
        #f16-ring { position: absolute; left: 380px; top: 750px; width: 200px; height: 200px; border-radius: 50%; border: 8px solid #F4F1EC; opacity: 0; }
        #f16-end { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        #f16-rays { position: absolute; left: -460px; top: -380px; width: 2000px; height: 2000px; opacity: 0;
          background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(139,123,255,.42) 0deg 5deg, rgba(139,123,255,0) 5deg 15deg);
          -webkit-mask-image: radial-gradient(closest-side, #000 15%, transparent 75%); mask-image: radial-gradient(closest-side, #000 15%, transparent 75%); }
        #f16-lock { position: absolute; left: 0; top: 300px; width: 1080px; height: 240px; display: flex; align-items: center; justify-content: center; gap: 30px; }
        #f16-icon { width: 200px; height: 200px; border-radius: 46px; overflow: hidden; box-shadow: 0 20px 70px rgba(255,107,53,.5); flex: none; }
        #f16-icon img { width: 100%; height: 100%; }
        #f16-name { font-size: 230px; }
        #f16-merci { position: absolute; left: 0; width: 1080px; top: 600px; text-align: center; font-size: 250px; }
        #f16-force { position: absolute; left: 0; width: 1080px; top: 840px; text-align: center; font-size: 130px; }
        #f16-tag { position: absolute; left: 0; width: 1080px; top: 1010px; display: flex; justify-content: center; }
      </style>
      <div id="root" data-composition-id="f16-cta" data-width="1080" data-height="1920" data-duration="10.0">
        <div class="scene" id="f16">
          <div id="f16-btns" class="p3d">
            <div class="f16-btn" id="f16-b1">
              <svg id="f16-hico" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#FF2D55"/></svg>
              <div class="disp" style="color:#0A0A0F" data-fit="620">Mets un like</div>
            </div>
            <div id="f16-w1" class="f16-who mono chip">Si tu dors moins de 7 h</div>
            <div class="f16-btn" id="f16-b2">
              <svg viewBox="0 0 100 100" fill="none" stroke="#F4F1EC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="74" cy="22" r="12"/><circle cx="26" cy="50" r="12"/><circle cx="74" cy="78" r="12"/><path d="M36 44 L64 28 M36 56 L64 72"/></svg>
              <div class="disp c-white" data-fit="620">Partage</div>
            </div>
            <div id="f16-w2" class="f16-who mono chip">À quelqu'un qui se couche trop tard</div>
            <div class="f16-btn" id="f16-b3">
              <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0A0A0F"/><path d="M50 28 V72 M28 50 H72" stroke="#F4F1EC" stroke-width="11" stroke-linecap="round"/></svg>
              <div class="disp" style="color:#0A0A0F" data-fit="620">Abonne-toi</div>
            </div>
            <i id="f16-ring"></i>
            <div id="f16-w3" class="f16-who mono chip"><i class="dot"></i>Chaque jour, un fait fitness vérifié</div>
            <svg class="f16-heart" id="f16-h0" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#FF2D55"/></svg>
            <svg class="f16-heart" id="f16-h1" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#FF6B35"/></svg>
            <svg class="f16-heart" id="f16-h2" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#FF2D55"/></svg>
            <svg class="f16-heart" id="f16-h3" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#8B7BFF"/></svg>
            <svg class="f16-heart" id="f16-h4" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#FF2D55"/></svg>
            <svg class="f16-heart" id="f16-h5" viewBox="0 0 100 100"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#FF6B35"/></svg>
          </div>
          <div id="f16-end">
            <div id="f16-rays"></div>
            <div id="f16-lock"><div id="f16-icon"><img src="assets/brand/icon-512.png" alt="" /></div><div id="f16-name" class="disp ex c-wheat">CaliBodi</div></div>
            <div id="f16-merci" class="disp ex c-heat" data-fit="960">Merci !</div>
            <div id="f16-force" class="disp ex c-wheat" data-fit="960">Ça nous donne beaucoup de force</div>
            <div id="f16-tag"><div class="mono chip" style="color:#F4F1EC">Like · Partage · Abonne-toi</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f16-cta", T0 = 59.30;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f16 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            const flip = (sel, t) => tl.fromTo(sel, { rotationX: -95, y: 120, opacity: 0, transformOrigin: "50% 100%" }, { rotationX: 0, y: 0, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, at(t));
            const press = (sel, t, d) => tl.fromTo(sel, { y: 0 }, { y: d, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, at(t));
            // like: pressed on "like", hearts burst out of the button
            flip("#f16-b1", 59.3);
            press("#f16-b1", 59.62, 14);
            tl.fromTo("#f16-hico", { scale: 1 }, { scale: 1.45, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(59.62));
            [[-70, -150, -30], [60, -190, 20], [200, -130, 35], [-110, -90, -40], [330, -170, 10], [130, -230, -15]].forEach(([dx, dy, r], i) => {
              tl.fromTo("#f16-h" + i, { x: 0, y: 0, scale: 0, rotation: 0 }, { x: dx, y: dy, scale: 1.1, rotation: r, duration: 0.6, ease: "power2.out" }, at(59.66 + i * 0.03));
              tl.fromTo("#f16-h" + i, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at(60.1 + i * 0.03));
            });
            tl.fromTo("#f16-w1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(60.02));
            // share
            flip("#f16-b2", 61.22);
            press("#f16-b2", 61.46, 12);
            tl.fromTo("#f16-w2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(61.8));
            // subscribe
            flip("#f16-b3", 63.3);
            press("#f16-b3", 63.6, 14);
            tl.fromTo("#f16-ring", { scale: 0.3, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, at(63.64));
            tl.fromTo("#f16-w3", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(64.12));
            // end card: everything flies past the camera, the brand lands
            tl.fromTo("#f16-btns", { opacity: 1, z: 0 }, { opacity: 0, z: 700, duration: 0.35, ease: "power3.in", immediateRender: false }, at(66.2));
            tl.fromTo("#f16-rays", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 40, duration: 3.0, ease: "power1.out" }, at(66.35));
            tl.fromTo("#f16-icon", { rotationY: 180, scale: 0.3, opacity: 0, transformPerspective: 900 }, { rotationY: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, at(66.38));
            tl.fromTo("#f16-name", { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(66.46));
            tl.fromTo("#f16-merci", { scale: 2.6, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, at(66.46));
            tl.fromTo("#f16-merci", { rotation: 0 }, { rotation: -3, duration: 0.3, ease: "back.out(3)", immediateRender: false }, at(66.76));
            tl.fromTo("#f16-force", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, at(67.1));
            tl.fromTo("#f16-tag", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, at(67.8));
            tl.fromTo("#f16-lock", { scale: 1 }, { scale: 1.04, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, at(67.9));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
