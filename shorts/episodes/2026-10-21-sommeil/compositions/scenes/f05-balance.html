<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f05-l1 { position: absolute; left: 70px; top: 236px; font-size: 170px; transform-origin: 0% 100%; }
        #f05-src { position: absolute; left: 76px; top: 404px; font-size: 21px; letter-spacing: .06em; color: #cfcbd8; }
        #f05-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .f05-sc { position: absolute; top: 470px; width: 400px; height: 400px; }
        #f05-s1 { left: 60px; } #f05-s2 { left: 620px; }
        .f05-sc svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .f05-lcd { position: absolute; left: 80px; top: 70px; width: 240px; height: 104px; border-radius: 18px; background: #06110c;
          display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 50px; letter-spacing: 0; }
        #f05-d1 { color: #00D4FF; text-shadow: 0 0 18px rgba(0,212,255,.8); }
        #f05-d2 { color: #FF2D55; text-shadow: 0 0 18px rgba(255,45,85,.8); }
        .f05-chip { position: absolute; top: 900px; }
        #f05-k1 { left: 150px; color: #00D4FF; } #f05-k2 { left: 710px; color: #FF2D55; }
        #f05-eq { position: absolute; left: 470px; top: 560px; width: 140px; text-align: center; font-size: 230px; }
        #f05-same { position: absolute; left: 0; width: 1080px; top: 990px; display: flex; justify-content: center; }
        #f05-same .chip { color: var(--green); font-size: 30px; }
      </style>
      <div id="root" data-composition-id="f05-balance" data-width="1080" data-height="1920" data-duration="2.7">
        <div class="scene" id="f05">
          <div id="f05-l1" class="disp ex c-white" data-fit="940">Sur la balance</div>
          <div id="f05-src" class="mono">Nedeltcheva et al., 2010 · poids total = graisse + masse maigre</div>
          <div id="f05-stage" class="p3d">
            <div class="f05-sc" id="f05-s1">
              <svg viewBox="0 0 400 400"><rect x="10" y="10" width="380" height="380" rx="70" fill="#1d1d29" stroke="#3a3a4a" stroke-width="6"/><rect x="40" y="250" width="130" height="110" rx="34" fill="#2a2a38"/><rect x="230" y="250" width="130" height="110" rx="34" fill="#2a2a38"/></svg>
              <div class="f05-lcd" id="f05-d1">0,0 kg</div>
            </div>
            <div class="f05-sc" id="f05-s2">
              <svg viewBox="0 0 400 400"><rect x="10" y="10" width="380" height="380" rx="70" fill="#1d1d29" stroke="#3a3a4a" stroke-width="6"/><rect x="40" y="250" width="130" height="110" rx="34" fill="#2a2a38"/><rect x="230" y="250" width="130" height="110" rx="34" fill="#2a2a38"/></svg>
              <div class="f05-lcd" id="f05-d2">0,0 kg</div>
            </div>
            <div class="f05-chip mono chip" id="f05-k1"><i class="dot"></i>8 h 30</div>
            <div class="f05-chip mono chip" id="f05-k2"><i class="dot"></i>5 h 30</div>
            <div id="f05-eq" class="disp ex c-wheat">≈</div>
          </div>
          <div id="f05-same"><div class="mono chip"><i class="dot"></i>Presque le même poids perdu</div></div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f05-balance", T0 = 15.05;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f05 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f05-l1", { rotationX: -100, opacity: 0, y: 40 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.8)" }, at(15.12));
            tl.fromTo("#f05-src", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at(15.4));
            // two scales drop in and bounce
            tl.fromTo("#f05-s1", { y: -900, rotation: -12 }, { y: 0, rotation: -3, duration: 0.45, ease: "bounce.out" }, at(15.3));
            tl.fromTo("#f05-s2", { y: -900, rotation: 12 }, { y: 0, rotation: 3, duration: 0.45, ease: "bounce.out" }, at(15.42));
            tl.fromTo("#f05-k1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, at(15.6));
            tl.fromTo("#f05-k2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, at(15.7));
            // the displays count to the total lost: -2,9 kg (8 h 30) and -3,0 kg (5 h 30)
            const fmt = (v) => (v > 0.04 ? "−" : "") + v.toFixed(1).replace(".", ",") + " kg";
            const c1 = { v: 0 }, c2 = { v: 0 }, d1 = document.getElementById("f05-d1"), d2 = document.getElementById("f05-d2");
            tl.fromTo(c1, { v: 0 }, { v: 2.9, duration: 0.8, ease: "power2.out", onUpdate: () => { d1.textContent = fmt(c1.v); } }, at(15.85));
            tl.fromTo(c2, { v: 0 }, { v: 3.0, duration: 0.8, ease: "power2.out", onUpdate: () => { d2.textContent = fmt(c2.v); } }, at(15.9));
            // "presque le même poids perdu"
            tl.fromTo("#f05-eq", { scale: 3, opacity: 0, z: 300 }, { scale: 1, opacity: 1, z: 0, duration: 0.2, ease: "power4.in" }, at(16.34));
            tl.fromTo("#f05-eq", { rotation: 0 }, { rotation: -8, duration: 0.25, ease: "back.out(3)", immediateRender: false }, at(16.54));
            tl.fromTo("#f05-same", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(16.78));
            tl.fromTo(["#f05-s1", "#f05-s2"], { scale: 1 }, { scale: 1.05, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(17.0));
            tl.fromTo("#f05-stage", { rotationX: 10 }, { rotationX: 0, duration: 2.4, ease: "sine.out" }, at(15.3));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
