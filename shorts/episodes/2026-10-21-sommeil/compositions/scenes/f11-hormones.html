          const build = () => {
            const tl = gsap.timeline({ paused: true });
            const nL = document.getElementById("f11-nL"), nR = document.getElementById("f11-nR");

            tl.fromTo("#f11-L .f11-tag", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, at(34.12));
            tl.fromTo("#f11-L .f11-trk", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", transformOrigin: "0% 50%" }, at(34.2));
            tl.fromTo(["#f11-L .f11-base", "#f11-L .f11-basel"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(34.35));
            tl.fromTo("#f11-xL", { scaleX: 0 }, { scaleX: 0.75, duration: 0.35, ease: "power3.out" }, at(34.3));
            tl.fromTo("#f11-L .f11-num", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, at(34.4));
            tl.fromTo("#f11-oL", { scaleY: 1 }, { scaleY: 0.94, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, at(34.5));
            // « stop, j'ai assez mangé »
            tl.fromTo("#f11-bL", { scale: 0, rotation: -10, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, at(35.34));
            // "…chute de 18 %": the bubble is silenced, the blob deflates, the level drops
            tl.fromTo("#f11-bL", { opacity: 1, y: 0 }, { opacity: 0, y: 40, duration: 0.25, ease: "power2.in", immediateRender: false }, at(37.0));
            tl.fromTo("#f11-oL", { scaleY: 1, scaleX: 1, y: 0 }, { scaleY: 0.72, scaleX: 1.12, y: 30, duration: 0.5, ease: "power3.out", immediateRender: false }, at(37.07));
            tl.fromTo("#f11-fLa", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, at(37.1));
            tl.fromTo("#f11-fLb", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, at(37.1));
            tl.fromTo("#f11-xL", { scaleX: 0.75 }, { scaleX: 0.615, duration: 0.5, ease: "power3.inOut", immediateRender: false }, at(37.1));
            const cL = { v: 0 };
            tl.fromTo(cL, { v: 0 }, { v: 18, duration: 0.45, ease: "power2.out", onUpdate: () => { nL.textContent = (cL.v > 0.5 ? "−" : "") + Math.round(cL.v) + " %"; } }, at(37.12));
            tl.fromTo("#f11-L .f11-num", { scale: 1 }, { scale: 1.18, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(37.55));
            // GHRÉLINE storms in
            tl.fromTo("#f11-L", { opacity: 1, scale: 1 }, { opacity: 0.6, scale: 0.94, duration: 0.3, ease: "power2.out", immediateRender: false }, at(38.5));
            tl.fromTo("#f11-oR", { x: 600, rotation: 40 }, { x: 0, rotation: 0, duration: 0.42, ease: "back.out(1.8)" }, at(38.56));
            tl.fromTo("#f11-R .f11-name", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, at(38.64));
            tl.fromTo("#f11-R .f11-tag", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, at(39.38));
            tl.fromTo("#f11-R .f11-trk", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", transformOrigin: "0% 50%" }, at(39.42));
            tl.fromTo(["#f11-R .f11-base", "#f11-R .f11-basel"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(39.55));
            tl.fromTo("#f11-xR", { scaleX: 0 }, { scaleX: 0.75, duration: 0.35, ease: "power3.out" }, at(39.5));

            tl.fromTo("#f11-oR", { x: 0 }, { x: 12, duration: 0.04, ease: "none", yoyo: true, repeat: 15, immediateRender: false }, at(39.66));
            tl.fromTo("#f11-mR", { scaleY: 1 }, { scaleY: 1.25, svgOrigin: "150 200", duration: 0.2, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false }, at(39.95));
            tl.fromTo("#f11-bR", { scale: 0, rotation: 10, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, at(40.62));

            tl.fromTo("#f11-oR", { scale: 1 }, { scale: 1.2, duration: 0.45, ease: "back.out(2)", immediateRender: false }, at(41.38));

            window.__timelines[ID] = tl;
