<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f08-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        #f08-l1 { position: absolute; left: 70px; top: 260px; font-size: 230px; transform-origin: 0% 100%; }
        #f08-arrow { position: absolute; left: 110px; top: 500px; width: 320px; height: 360px; transform-origin: 50% 50%; }
        #f08-sign { position: absolute; left: 560px; top: 500px; width: 360px; height: 360px; }
        #f08-l2 { position: absolute; left: 70px; top: 890px; font-size: 170px; transform-origin: 0% 100%; }
      </style>
      <div id="root" data-composition-id="f08-mauvais" data-width="1080" data-height="1920" data-duration="2.35">
        <div class="scene" id="f08">
          <div id="f08-cam" class="p3d" data-layout-allow-overlap>
            <div id="f08-l1" class="disp ex c-white" data-fit="940">Tu maigris…</div>
            <svg id="f08-arrow" viewBox="0 0 320 360">
              <path id="f08-ar-g" d="M110 10 H210 V210 H290 L160 350 L30 210 H110 Z" fill="#00FF87" stroke="#0A0A0F" stroke-width="10" stroke-linejoin="round"/>
              <path id="f08-ar-r" d="M110 10 H210 V210 H290 L160 350 L30 210 H110 Z" fill="#FF2D55" stroke="#0A0A0F" stroke-width="10" stroke-linejoin="round" opacity="0"/>
            </svg>
            <svg id="f08-sign" viewBox="0 0 360 360"><circle cx="180" cy="180" r="170" fill="#F4F1EC"/><circle cx="180" cy="180" r="150" fill="#FF2D55"/><rect x="62" y="150" width="236" height="60" rx="12" fill="#F4F1EC"/></svg>
            <div id="f08-l2" class="disp ex c-red" data-fit="940">Du mauvais côté</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f08-mauvais", T0 = 26.90;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f08 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            // "Tu maigris…": a green arrow goes down, looks like good news
            tl.fromTo("#f08-l1", { rotationX: -100, opacity: 0, y: 40 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.8)" }, at(27.0));
            tl.fromTo("#f08-arrow", { y: -260, opacity: 0, scale: 0.6 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at(27.18));
            tl.fromTo("#f08-arrow", { y: 0 }, { y: 30, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, at(27.6));
            // "…mais du mauvais côté.": the arrow turns red and swings, a no-entry sign slams in
            tl.fromTo("#f08-ar-r", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, at(28.12));
            tl.fromTo("#f08-arrow", { rotation: 0, x: 0 }, { rotation: 38, x: 20, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, at(28.12));
            tl.fromTo("#f08-l2", { x: 760, skewX: -16, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, at(28.2));
            tl.fromTo("#f08-sign", { scale: 3, opacity: 0, rotation: -30, z: 300 }, { scale: 1, opacity: 1, rotation: -8, z: 0, duration: 0.2, ease: "power4.in" }, at(28.28));
            tl.fromTo("#f08-sign", { rotation: -8 }, { rotation: 4, duration: 0.3, ease: "back.out(3)", immediateRender: false }, at(28.48));
            tl.fromTo("#f08-cam", { rotationY: 6, scale: 1 }, { rotationY: -6, scale: 1.04, duration: 2.35, ease: "sine.inOut" }, 0);
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
