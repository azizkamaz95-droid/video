<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f10-media { position: absolute; inset: 0; opacity: .55; }
        #f10-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,.7) 0%, rgba(10,10,15,.2) 40%, rgba(10,10,15,.55) 64%, #0A0A0F 86%); }
        #f10-src { position: absolute; left: 70px; top: 236px; color: var(--night); font-size: 22px; letter-spacing: .08em; }
        #f10-src2 { position: absolute; left: 76px; top: 312px; font-size: 21px; letter-spacing: .06em; color: #cfcbd8; }
        #f10-l1 { position: absolute; left: 70px; top: 360px; font-size: 130px; transform-origin: 0% 100%; }
        #f10-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .f10-moon { position: absolute; top: 560px; width: 140px; height: 140px; }
        #f10-m1 { left: 70px; } #f10-m2 { left: 240px; }
        #f10-n { position: absolute; left: 70px; top: 720px; font-size: 170px; transform-origin: 0% 100%; }
        #f10-seul { position: absolute; left: 60px; top: 900px; padding: 8px 26px 2px; border: 7px solid #FF2D55; border-radius: 18px; font-size: 110px; rotate: -8deg; }
        #f10-clock { position: absolute; left: 560px; top: 500px; width: 440px; height: 460px; }
        .f10-ringl { opacity: 0; }
        #f10-h4 { position: absolute; left: 560px; top: 960px; width: 440px; text-align: center; font-size: 150px; }
      </style>
      <div id="root" data-composition-id="f10-quatre" data-width="1080" data-height="1920" data-duration="2.6">
        <div class="scene" id="f10">
          <div id="f10-media">
            <video id="f10-vid" class="clip media-fill" src="assets/clips/stars.mp4" muted playsinline data-start="0" data-duration="2.6" data-media-start="4" data-track-index="0"></video>
          </div>
          <div id="f10-shade"></div>
          <div id="f10-src" class="mono chip"><i class="dot"></i>Étude 2 · Ann. Intern. Med. · 2004</div>
          <div id="f10-src2" class="mono">Spiegel et al. · 12 hommes jeunes en bonne santé</div>
          <div id="f10-l1" class="disp ex c-white" data-fit="940">Une autre étude</div>
          <div id="f10-stage" class="p3d">
            <svg class="f10-moon" id="f10-m1" viewBox="0 0 100 100"><path d="M64 8 A44 44 0 1 0 92 70 A36 36 0 1 1 64 8 Z" fill="#8B7BFF"/></svg>
            <svg class="f10-moon" id="f10-m2" viewBox="0 0 100 100"><path d="M64 8 A44 44 0 1 0 92 70 A36 36 0 1 1 64 8 Z" fill="#8B7BFF"/></svg>
            <div id="f10-n" class="disp ex c-night" data-fit="440">2 nuits</div>
            <svg id="f10-clock" viewBox="0 0 440 460">
              <path class="f10-ringl" id="f10-rl" d="M40 120 Q10 170 30 230 M70 140 Q52 175 62 212" stroke="#FF2D55" stroke-width="12" fill="none" stroke-linecap="round"/>
              <path class="f10-ringl" id="f10-rr" d="M400 120 Q430 170 410 230 M370 140 Q388 175 378 212" stroke="#FF2D55" stroke-width="12" fill="none" stroke-linecap="round"/>
              <circle cx="122" cy="98" r="46" fill="#F4F1EC"/><circle cx="318" cy="98" r="46" fill="#F4F1EC"/>
              <path d="M120 420 L96 452 M320 420 L344 452" stroke="#F4F1EC" stroke-width="18" stroke-linecap="round"/>
              <circle cx="220" cy="260" r="172" fill="#F4F1EC"/>
              <circle cx="220" cy="260" r="148" fill="#15151f"/>
              <g fill="#F4F1EC"><rect x="214" y="124" width="12" height="26" rx="5"/><rect x="214" y="370" width="12" height="26" rx="5"/><rect x="84" y="254" width="26" height="12" rx="5"/><rect x="330" y="254" width="26" height="12" rx="5"/></g>
              <rect id="f10-min" x="212" y="140" width="16" height="124" rx="8" fill="#F4F1EC"/>
              <rect id="f10-hour" x="210" y="178" width="20" height="86" rx="10" fill="#FF2D55"/>
              <circle cx="220" cy="260" r="16" fill="#FF2D55"/>
            </svg>
            <div id="f10-h4" class="disp ex c-red">4 h</div>
            <div id="f10-seul" class="disp c-red">Seulement</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f10-quatre", T0 = 30.70;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f10 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f10-media", { scale: 1.1 }, { scale: 1.0, duration: 2.6, ease: "none" }, 0);
            tl.fromTo("#f10-src", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(30.74));
            tl.fromTo("#f10-src2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at(30.95));
            tl.fromTo("#f10-l1", { rotationX: -100, opacity: 0, y: 40 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.8)" }, at(30.8));
            // "deux nuits"
            tl.fromTo("#f10-m1", { scale: 0, rotation: -140 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }, at(31.82));
            tl.fromTo("#f10-m2", { scale: 0, rotation: -140 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }, at(31.95));
            tl.fromTo("#f10-n", { x: -200, skewX: 14, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(32.0));
            // "…de quatre heures": an alarm clock bounces in, the hour hand spins to 4
            tl.fromTo("#f10-clock", { y: -1300, rotation: 20 }, { y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.5)" }, at(32.1));
            tl.fromTo("#f10-hour", { rotation: -240, svgOrigin: "220 260" }, { rotation: 120, svgOrigin: "220 260", duration: 0.45, ease: "power3.out" }, at(32.3));
            tl.fromTo("#f10-min", { rotation: -720, svgOrigin: "220 260" }, { rotation: 0, svgOrigin: "220 260", duration: 0.45, ease: "power3.out" }, at(32.3));
            tl.fromTo("#f10-h4", { scale: 2.6, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out" }, at(32.36));
            // "…seulement." stamp, then the alarm rings
            tl.fromTo("#f10-seul", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.in" }, at(32.6));
            tl.fromTo("#f10-clock", { rotation: 0 }, { rotation: 7, duration: 0.045, ease: "none", yoyo: true, repeat: 11, immediateRender: false }, at(32.96));
            tl.fromTo(["#f10-rl", "#f10-rr"], { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, at(32.96));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
