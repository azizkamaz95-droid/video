<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f04-media { position: absolute; inset: 0; opacity: .6; }
        #f04-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,.75) 0%, rgba(10,10,15,.2) 40%, rgba(10,10,15,.55) 64%, #0A0A0F 86%); }
        #f04-l1 { position: absolute; left: 70px; top: 236px; font-size: 150px; transform-origin: 0% 100%; }
        #f04-l2 { position: absolute; left: 70px; top: 368px; font-size: 210px; transform-origin: 0% 100%; }
        #f04-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .f04-card { position: absolute; top: 600px; width: 440px; height: 470px; border-radius: 36px; overflow: hidden; }
        #f04-c1 { left: 60px; background: linear-gradient(170deg, #062f3d, #0d1520 70%); border: 5px solid #00D4FF; box-shadow: 0 0 60px rgba(0,212,255,.35), 0 40px 90px rgba(0,0,0,.6); }
        #f04-c2 { left: 580px; background: linear-gradient(170deg, #3d0c1a, #1a1014 70%); border: 5px solid #FF2D55; box-shadow: 0 0 60px rgba(255,45,85,.35), 0 40px 90px rgba(0,0,0,.6); }
        .f04-lab { position: absolute; left: 34px; top: 30px; font-size: 24px; color: #cfcbd8; }
        .f04-moon { position: absolute; right: 30px; top: 22px; width: 84px; height: 84px; }
        .f04-num { position: absolute; left: 0; width: 440px; top: 120px; text-align: center; font-size: 190px; }
        .f04-bat { position: absolute; left: 34px; top: 330px; width: 372px; height: 76px; border-radius: 16px; border: 4px solid rgba(244,241,236,.55); padding: 6px; display: flex; gap: 5px; }
        .f04-bat::after { content: ""; position: absolute; right: -16px; top: 22px; width: 10px; height: 24px; border-radius: 0 6px 6px 0; background: rgba(244,241,236,.55); }
        .f04-cell { position: relative; flex: 1; height: 100%; border-radius: 6px; background: rgba(244,241,236,.08); overflow: hidden; }
        .f04-cell i { position: absolute; left: 0; top: 0; height: 100%; width: 100%; transform-origin: 0% 50%; }
        #f04-c1 .f04-cell i { background: #00D4FF; box-shadow: 0 0 14px rgba(0,212,255,.8); }
        #f04-c2 .f04-cell i { background: #FF2D55; box-shadow: 0 0 14px rgba(255,45,85,.8); }
        .f04-cap { position: absolute; left: 0; width: 440px; top: 420px; text-align: center; font-size: 20px; color: #cfcbd8; }
        #f04-vs { position: absolute; left: 470px; top: 770px; width: 140px; height: 140px; border-radius: 50%; background: #0A0A0F; border: 6px solid #F4F1EC;
          display: flex; align-items: center; justify-content: center; font-size: 84px; box-shadow: 0 20px 50px rgba(0,0,0,.7); }
      </style>
      <div id="root" data-composition-id="f04-difference" data-width="1080" data-height="1920" data-duration="3.65">
        <div class="scene" id="f04">
          <div id="f04-media">
            <video id="f04-vid" class="clip media-fill" src="assets/clips/stars.mp4" muted playsinline data-start="0" data-duration="3.65" data-track-index="0"></video>
          </div>
          <div id="f04-shade"></div>
          <div id="f04-l1" class="disp ex c-white" data-fit="900">Une seule</div>
          <div id="f04-l2" class="disp ex c-night" data-fit="940">Différence</div>
          <div id="f04-stage" class="p3d">
            <div class="f04-card" id="f04-c1">
              <div class="f04-lab mono">Au lit</div>
              <svg class="f04-moon" viewBox="0 0 100 100"><path d="M64 8 A44 44 0 1 0 92 70 A36 36 0 1 1 64 8 Z" fill="#00D4FF"/></svg>
              <div class="f04-num disp ex c-water" data-fit="400">8 h 30</div>
              <div class="f04-bat" id="f04-b1"></div>
              <div class="f04-cap mono">Nuit longue</div>
            </div>
            <div class="f04-card" id="f04-c2">
              <div class="f04-lab mono">Au lit</div>
              <svg class="f04-moon" viewBox="0 0 100 100"><path d="M64 8 A44 44 0 1 0 92 70 A36 36 0 1 1 64 8 Z" fill="#FF2D55"/></svg>
              <div class="f04-num disp ex c-red" data-fit="400">5 h 30</div>
              <div class="f04-bat" id="f04-b2"></div>
              <div class="f04-cap mono">Nuit courte</div>
            </div>
            <div id="f04-vs" class="disp c-white">VS</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f04-difference", T0 = 11.40;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f04 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            // battery = 9 cells of one hour: 8.5 and 5.5 cells get filled (real proportions)
            const fills = { 1: 8.5, 2: 5.5 };
            [1, 2].forEach((k) => {
              const bat = document.getElementById("f04-b" + k);
              for (let i = 0; i < 9; i++) {
                const c = document.createElement("div");
                c.className = "f04-cell";
                c.innerHTML = '<i id="f04-f' + k + "-" + i + '"></i>';
                bat.appendChild(c);
              }
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f04-media", { scale: 1.12 }, { scale: 1.0, duration: 3.65, ease: "none" }, 0);
            tl.fromTo("#f04-l1", { x: -300, skewX: 16, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(11.52));
            tl.fromTo("#f04-l2", { rotationX: -100, opacity: 0, y: 40 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, at(11.86));
            // "huit heures et demie au lit…"
            tl.fromTo("#f04-c1", { x: -700, rotationY: 80, z: -300, opacity: 0 }, { x: 0, rotationY: 16, z: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, at(12.62));
            [1, 2].forEach((k) => {
              const t0 = k === 1 ? 12.82 : 14.02;
              for (let i = 0; i < 9; i++) {
                const full = Math.min(1, Math.max(0, fills[k] - i));
                tl.fromTo("#f04-f" + k + "-" + i, { scaleX: 0 }, { scaleX: full, duration: 0.08, ease: "power1.out" }, at(t0 + i * 0.055));
              }
            });
            // "…ou cinq heures et demie."
            tl.fromTo("#f04-vs", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.4)" }, at(13.86));
            tl.fromTo("#f04-c2", { x: 700, rotationY: -80, z: -300, opacity: 0 }, { x: 0, rotationY: -16, z: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, at(13.92));
            tl.fromTo("#f04-c2", { rotation: 0 }, { rotation: 2, duration: 0.05, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, at(14.55));
            tl.fromTo("#f04-stage", { rotationX: 8, y: 0 }, { rotationX: -2, y: -16, duration: 2.4, ease: "sine.inOut" }, at(12.62));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
