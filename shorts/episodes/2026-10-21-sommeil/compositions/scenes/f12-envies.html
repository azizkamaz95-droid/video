<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f12-src { position: absolute; left: 70px; top: 236px; color: var(--night); font-size: 22px; letter-spacing: .08em; }
        #f12-l1 { position: absolute; left: 70px; top: 306px; font-size: 130px; transform-origin: 0% 100%; }
        #f12-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .f12-card { position: absolute; width: 280px; height: 350px; border-radius: 28px; overflow: hidden; background: #15151f; border: 5px solid #F4F1EC;
          box-shadow: 0 30px 70px rgba(0,0,0,.65); }
        #f12-c1 { left: 50px; top: 460px; rotate: -8deg; } #f12-c2 { left: 390px; top: 500px; rotate: 3deg; } #f12-c3 { left: 730px; top: 410px; rotate: 9deg; }
        .f12-card img { position: absolute; left: 0; top: 0; width: 100%; height: 280px; object-fit: cover; }
        .f12-lab { position: absolute; left: 0; top: 280px; width: 100%; height: 70px; background: #0A0A0F; display: flex; align-items: center; justify-content: center; font-size: 58px; }
        #f12-big { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        #f12-jq { position: absolute; left: 70px; top: 420px; font-size: 130px; transform-origin: 0% 100%; }
        #f12-n { position: absolute; left: 50px; width: 980px; top: 540px; text-align: center; font-size: 380px; }
        #f12-range { position: absolute; left: 0; width: 1080px; top: 940px; display: flex; justify-content: center; }
        #f12-range .chip { color: var(--heat); font-size: 28px; }
      </style>
      <div id="root" data-composition-id="f12-envies" data-width="1080" data-height="1920" data-duration="5.25">
        <div class="scene" id="f12">
          <div id="f12-src" class="mono chip"><i class="dot"></i>Spiegel et al. · 2004 · aliments très caloriques</div>
          <div id="f12-l1" class="disp ex c-white" data-fit="900">L'envie de…</div>
          <div id="f12-stage" class="p3d" data-layout-allow-overlap>
            <div class="f12-card" id="f12-c1"><img src="assets/food/sucre.jpg" alt="" /><div class="f12-lab disp c-heat">Sucré</div></div>
            <div class="f12-card" id="f12-c2"><img src="assets/food/sale.jpg" alt="" /><div class="f12-lab disp c-heat">Salé</div></div>
            <div class="f12-card" id="f12-c3"><img src="assets/food/feculents.jpg" alt="" /><div class="f12-lab disp c-heat">Féculents</div></div>
          </div>
          <div id="f12-big" class="p3d" data-layout-allow-overlap>
            <div id="f12-jq" class="disp ex c-white" data-fit="900">Jusqu'à</div>
            <div id="f12-n" class="disp ex c-heat" data-fit="960">+45 %</div>
            <div id="f12-range"><div class="mono chip"><i class="dot"></i>Étude : de +33 à +45 %</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f12-envies", T0 = 42.60;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f12 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f12-src", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(42.66));
            tl.fromTo("#f12-l1", { x: -400, skewX: 16, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(42.74));
            // three cravings fly in from deep space, one per word
            [["1", 43.12, -60], ["2", 43.9, 0], ["3", 44.4, 60]].forEach(([k, t, ry]) => {
              tl.fromTo("#f12-c" + k, { z: -1600, rotationY: ry * 3, rotationX: 40, opacity: 0 }, { z: 0, rotationY: ry / 4, rotationX: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, at(t));
            });
            tl.fromTo(["#f12-c1", "#f12-c2", "#f12-c3"], { y: 0 }, { y: -18, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.12, immediateRender: false }, at(44.9));
            // "Jusqu'à 45 % de plus": the cards fall back, the number slams
            tl.fromTo("#f12-stage", { z: 0, opacity: 1, filter: "blur(0px)" }, { z: -500, opacity: 0.35, filter: "blur(4px)", duration: 0.35, ease: "power3.inOut", immediateRender: false }, at(46.05));
            tl.fromTo("#f12-l1", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, at(46.05));
            tl.fromTo("#f12-jq", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "expo.out" }, at(46.1));
            tl.fromTo("#f12-n", { scale: 3.2, opacity: 0, z: 400 }, { scale: 1, opacity: 1, z: 0, duration: 0.2, ease: "power4.in" }, at(46.27));
            tl.fromTo("#f12-n", { rotation: 0 }, { rotation: -6, duration: 0.3, ease: "back.out(3)", immediateRender: false }, at(46.47));
            tl.fromTo("#f12-range", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(46.8));
            tl.fromTo("#f12-n", { scale: 1 }, { scale: 1.06, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, at(47.1));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
