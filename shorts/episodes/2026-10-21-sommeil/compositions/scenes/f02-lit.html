<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f02-media { position: absolute; inset: 0; }
        #f02-shade { position: absolute; inset: 0;
          background: linear-gradient(180deg, rgba(10,10,15,.88) 0%, rgba(12,10,40,.45) 34%, rgba(12,10,40,.55) 60%, rgba(10,10,15,.95) 80%, #0A0A0F 100%); }
        #f02-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .f02-l { position: absolute; left: 70px; transform-origin: 0% 100%; }
        #f02-l1 { top: 236px; font-size: 140px; }
        #f02-l2 { top: 386px; font-size: 250px; }
        #f02-stk { position: absolute; left: 270px; top: 610px; width: 540px; height: 540px; }
        #f02-stk img { width: 100%; height: 100%; }
        .f02-z { position: absolute; left: 560px; top: 670px; font-size: 110px; color: #F4F1EC; -webkit-text-stroke: 5px #6a58f0; opacity: 0; }
      </style>
      <div id="root" data-composition-id="f02-lit" data-width="1080" data-height="1920" data-duration="1.28">
        <div class="scene" id="f02">
          <div id="f02-media">
            <video id="f02-vid" class="clip media-fill" src="assets/clips/bedroom.mp4" muted playsinline data-start="0" data-duration="1.28" data-track-index="0"></video>
          </div>
          <div id="f02-shade"></div>
          <div id="f02-cam" class="p3d" data-layout-allow-overlap>
            <div id="f02-l1" class="f02-l disp ex c-white" data-fit="900">Il est dans</div>
            <div id="f02-l2" class="f02-l disp ex c-red" data-fit="940">Ton lit</div>
            <div id="f02-stk"><img src="assets/calix/calix-endormi.png" alt="Calix endormi" /></div>
            <div class="f02-z disp" id="f02-z1">Z</div>
            <div class="f02-z disp" id="f02-z2">Z</div>
            <div class="f02-z disp" id="f02-z3">Z</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f02-lit", T0 = 3.42;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f02 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            // crash zoom into the bedroom
            tl.fromTo("#f02-media", { scale: 1.3, filter: "brightness(1.6)" }, { scale: 1.05, filter: "brightness(1)", duration: 0.5, ease: "power3.out" }, 0);
            tl.fromTo("#f02-media", { scale: 1.05 }, { scale: 1.12, duration: 0.78, ease: "none", immediateRender: false }, 0.5);
            tl.fromTo("#f02-l1", { z: -1400, opacity: 0, filter: "blur(12px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, at(3.45));
            // Calix asleep: the sticker slaps in with a 3D flip
            tl.fromTo("#f02-stk", { scale: 0.2, rotationY: 120, rotation: -24, opacity: 0 }, { scale: 1, rotationY: 0, rotation: -4, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, at(3.52));
            tl.fromTo("#f02-stk", { scale: 1 }, { scale: 1.035, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, at(4.05));
            // "…ton lit." lands hard (shake in index)
            tl.fromTo("#f02-l2", { scale: 3, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.in" }, at(3.82));
            tl.fromTo("#f02-l2", { rotation: 0 }, { rotation: -4, duration: 0.25, ease: "back.out(3)", immediateRender: false }, at(4.04));
            // Zzz drift up out of the sticker
            [["1", 3.78, -40, 0.7], ["2", 4.0, 30, 0.9], ["3", 4.22, -10, 1.1]].forEach(([k, t, dx, s]) => {
              tl.fromTo("#f02-z" + k, { x: 0, y: 0, opacity: 0, scale: 0.4, rotation: -10 }, { x: dx + 120, y: -300, opacity: 1, scale: s, rotation: 12, duration: 0.6, ease: "power1.out" }, at(t));
              tl.fromTo("#f02-z" + k, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, at(t + 0.45));
            });
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
