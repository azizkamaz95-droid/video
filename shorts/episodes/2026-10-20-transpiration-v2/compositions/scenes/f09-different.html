      <script>
        (function () {
          const ID = "f09-different", T0 = 23.30;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f09 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";

            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f09-band", { x: -1300 }, { x: 0, duration: 0.32, ease: "expo.out" }, at(23.32));
            tl.fromTo("#f09-band", { backgroundPositionX: "0px" }, { backgroundPositionX: "192px", duration: 3.1, ease: "none" }, at(23.32));
            tl.fromTo("#f09-warn", { scale: 1 }, { scale: 1.2, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, at(23.6));
            tl.fromTo("#f09-band", { y: 0, scale: 1 }, { y: -40, scale: 0.86, duration: 0.4, ease: "power3.inOut", immediateRender: false }, at(24.3));

            tl.fromTo("#f09-c2", { x: 700, rotationY: -80, z: -300, opacity: 0 }, { x: 0, rotationY: -22, z: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, at(24.55));
            tl.fromTo("#f09-neq", { scale: 3.4, opacity: 0, z: 300 }, { scale: 1, opacity: 1, z: 0, duration: 0.18, ease: "power4.in" }, at(24.70));
            tl.fromTo("#f09-neq", { rotation: 0 }, { rotation: -8, duration: 0.25, ease: "back.out(3)", immediateRender: false }, at(24.88));
            // "…perdre de la graisse": the fat card is the one that matters
            tl.fromTo("#f09-c2", { scale: 1 }, { scale: 1.07, duration: 0.25, ease: "power2.out", immediateRender: false }, at(25.34));
            tl.fromTo("#f09-glow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at(25.34));
            tl.fromTo("#f09-c1", { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power1.out", immediateRender: false }, at(25.34));
            tl.fromTo("#f09-stage", { rotationX: 6, y: 0 }, { rotationX: -2, y: -20, duration: 2.0, ease: "sine.inOut" }, at(24.42));

          document.fonts.ready.then(build);
        })();
