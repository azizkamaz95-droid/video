<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f10-q { position: absolute; left: 70px; top: 250px; font-size: 60px; }
        #f10-t { position: absolute; left: 64px; top: 330px; font-size: 210px; }
        #f10-card { position: absolute; left: 70px; top: 570px; width: 400px; height: 520px; border-radius: 36px; overflow: hidden; border: 5px solid #F4F1EC; box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 50px rgba(0,212,255,.3); }
        #f10-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,60,90,.15), rgba(0,0,0,0) 40%, rgba(10,10,15,.35)); }
        #f10-side { position: absolute; left: 520px; top: 570px; width: 400px; height: 520px; }
        #f10-plab { position: absolute; left: 0; top: 0; color: #cfcbd8; font-size: 22px; }
        #f10-track { position: absolute; left: 0; top: 50px; width: 96px; height: 400px; border-radius: 48px; background: #1f1f2b; border: 4px solid #2f2f40; overflow: hidden; }
        #f10-fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; background: linear-gradient(0deg, #00a3c4, #00D4FF); transform-origin: 50% 100%; }
        #f10-mark { position: absolute; left: -10px; width: 116px; height: 6px; background: #F4F1EC; top: 0; border-radius: 3px; opacity: .5; }
        #f10-arrow { position: absolute; left: 110px; top: 90px; width: 150px; height: 300px; }
        #f10-l1 { position: absolute; left: 130px; top: 300px; font-size: 76px; }
        #f10-l2 { position: absolute; left: 130px; top: 362px; font-size: 120px; }
        #f10-nat { position: absolute; left: 132px; top: 480px; color: var(--green); font-size: 22px; }
      </style>
      <div id="root" data-composition-id="f10-rehydrate" data-width="1080" data-height="1920" data-duration="3.65">
        <div class="scene" id="f10">
          <div id="f10-q" class="sub">Quand tu te</div>
          <div id="f10-t" class="disp ex c-water" data-fit="950">Réhydrates</div>
          <div id="f10-card"><video id="f10-vid" class="clip media-fill" src="assets/clips/pour-glass.mp4" muted playsinline data-start="0" data-duration="3.65" data-track-index="0"></video></div>
          <div id="f10-side">
            <div id="f10-plab" class="mono">Poids sur la balance</div>
            <div id="f10-track"><div id="f10-fill"></div><i id="f10-mark"></i></div>
            <svg id="f10-arrow" viewBox="0 0 150 300"><path id="f10-ap" d="M20 280 C 20 170, 120 160, 110 30 M 80 58 L 110 26 L 138 60" fill="none" stroke="#00FF87" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div id="f10-l1" class="disp ex-sm c-white">Une partie</div>
            <div id="f10-l2" class="disp ex c-green">revient</div>
            <div id="f10-nat" class="mono chip">Naturellement</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f10-rehydrate", T0 = 26.45;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f10 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f10-q", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(26.47));
            tl.fromTo("#f10-t", { z: -1000, opacity: 0, rotationY: -30 }, { z: 0, opacity: 1, rotationY: 0, duration: 0.5, ease: "power4.out" }, at(26.86));
            tl.fromTo("#f10-card", { rotationY: 70, x: -200, opacity: 0, transformPerspective: 1400 }, { rotationY: 16, x: 0, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, at(26.60));
            tl.fromTo("#f10-card", { rotationY: 16 }, { rotationY: 6, duration: 2.5, ease: "sine.inOut", immediateRender: false, transformPerspective: 1400 }, at(27.15));
            tl.fromTo("#f10-side", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at(27.1));
            // gauge: low after the session, then part of it comes back (no scale, no number)
            tl.fromTo("#f10-fill", { scaleY: 0.82 }, { scaleY: 0.48, duration: 0.5, ease: "power2.inOut" }, at(27.2));
            tl.fromTo("#f10-mark", { y: 72 }, { y: 72, duration: 0.01 }, at(27.1));
            tl.fromTo("#f10-fill", { scaleY: 0.48 }, { scaleY: 0.7, duration: 0.9, ease: "power2.out", immediateRender: false }, at(28.15));
            tl.fromTo("#f10-ap", { strokeDasharray: 420, strokeDashoffset: 420 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, at(28.40));
            tl.fromTo("#f10-l1", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(28.01));
            tl.fromTo("#f10-l2", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, at(28.95));
            tl.fromTo("#f10-nat", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, at(29.23));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
