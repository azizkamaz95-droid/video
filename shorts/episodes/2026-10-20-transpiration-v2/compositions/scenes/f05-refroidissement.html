        #f05-back { background: linear-gradient(160deg, #06303b, #0f1622 60%); border: 4px solid rgba(0,212,255,.65); box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 80px rgba(0,212,255,.35); transform: rotateY(180deg); }
        .f05-ico { position: absolute; left: 50px; top: 50px; width: 150px; height: 150px; }

        #f05-strike { position: absolute; left: 34px; top: 300px; width: 830px; height: 18px; border-radius: 9px; background: var(--red); transform-origin: 0% 50%; box-shadow: 0 0 20px rgba(255,45,85,.8); rotate: -3deg; }

      <div id="root" data-composition-id="f05-refroidissement" data-width="1080" data-height="1920" data-duration="4.73">
        <div class="scene" id="f05">
          <div id="f05-steam"><video id="f05-vid" class="clip media-fill" src="assets/clips/steam.mp4" muted playsinline data-start="0" data-duration="4.73" data-track-index="0"></video></div>

              <svg class="f05-wave" id="f05-w2" style="top:110px; opacity:.6" viewBox="0 0 300 40"><path d="M0 20 Q 25 0 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20" fill="none" stroke="#00D4FF" stroke-width="6" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f05-refroidissement", T0 = 9.60;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f05 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f05-ghost", { x: 0 }, { x: -260, duration: 4.73, ease: "none" }, 0);
            tl.fromTo("#f05-tag", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.02);
            tl.fromTo("#f05-title", { z: -900, opacity: 0, rotationX: 30 }, { z: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "power4.out" }, at(9.72));
            // the card swings up from the floor
            tl.fromTo("#f05-card", { rotationX: -85, y: 200, z: -400, opacity: 0, transformOrigin: "50% 100%" }, { rotationX: 0, y: 0, z: 0, opacity: 1, duration: 0.6, ease: "back.out(1.3)" }, at(10.30));
            tl.fromTo("#f05-card", { rotationY: 0, rotationX: 0 }, { rotationY: -7, rotationX: 4, duration: 1.4, ease: "sine.inOut", immediateRender: false }, at(10.9));
            tl.fromTo("#f05-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, at(11.72));
            tl.fromTo("#f05-faux", { scale: 2, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.25, ease: "back.out(3)" }, at(11.85));
            // flip: false → true
            tl.fromTo("#f05-card", { rotationY: -7 }, { rotationY: 180, duration: 0.62, ease: "power3.inOut", immediateRender: false }, at(12.40));
            tl.fromTo("#f05-card", { scale: 1 }, { scale: 0.92, duration: 0.31, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(12.40));
            tl.fromTo("#f05-bt2", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" }, at(13.20));
            tl.fromTo(["#f05-w1", "#f05-w2"], { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.1 }, at(13.30));
            tl.fromTo("#f05-card", { rotationY: 180 }, { rotationY: 172, duration: 1.0, ease: "sine.inOut", immediateRender: false }, at(13.1));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
