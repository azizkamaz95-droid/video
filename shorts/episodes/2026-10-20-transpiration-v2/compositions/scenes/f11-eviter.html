<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f11-alors { position: absolute; left: 70px; top: 226px; color: var(--heat); }
        #f11-title { position: absolute; left: 66px; top: 300px; font-size: 230px; }
        #f11-x { position: absolute; left: 760px; top: 318px; width: 170px; height: 170px; }
        #f11-sub { position: absolute; left: 70px; top: 530px; width: 900px; font-size: 52px; line-height: 1.08; }
        #f11-sub span { display: inline-block; margin-right: .22em; }
        #f11-sub .hot { color: var(--heat); }
        .f11-card { position: absolute; top: 680px; width: 400px; height: 420px; border-radius: 34px; overflow: hidden; border: 5px solid #F4F1EC; background: #15151f; box-shadow: 0 40px 90px rgba(0,0,0,.6); }
        #f11-c1 { left: 70px; } #f11-c2 { left: 510px; }
        .f11-media { position: absolute; left: 0; top: 0; width: 100%; height: 300px; overflow: hidden; }
        .f11-media img { width: 100%; height: 100%; object-fit: cover; }
        .f11-lab { position: absolute; left: 0; top: 300px; width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 34px; line-height: 1.05; padding: 0 20px; background: #15151f; }
        .f11-stamp { position: absolute; left: 110px; top: 60px; width: 180px; height: 180px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="f11-eviter" data-width="1080" data-height="1920" data-duration="6.35">
        <div class="scene" id="f11">
          <div id="f11-alors" class="mono chip">Alors…</div>
          <div id="f11-title" class="disp ex c-red" data-fit="680">À éviter</div>
          <svg id="f11-x" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#FF2D55"/><path d="M33 33 L67 67 M67 33 L33 67" stroke="#0A0A0F" stroke-width="11" stroke-linecap="round"/></svg>
          <div id="f11-sub" class="sub"><span id="f11-w0">Ne</span><span id="f11-w1">cherche</span><span id="f11-w2">pas</span><span id="f11-w3">à</span><span id="f11-w4" class="hot">transpirer</span><span id="f11-w5" class="hot">davantage</span></div>
          <div class="f11-card" id="f11-c1">
            <div class="f11-media"><img src="assets/stock/pixabay-photo-1283576.jpg" alt="" style="object-position: 50% 30%" /></div>
            <div class="f11-lab sub">Vêtements trop chauds</div>
            <svg class="f11-stamp" id="f11-s1" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#FF2D55" stroke-width="9"/><path d="M30 30 L70 70 M70 30 L30 70" stroke="#FF2D55" stroke-width="11" stroke-linecap="round"/></svg>
          </div>
          <div class="f11-card" id="f11-c2">
            <div class="f11-media"><video id="f11-vid" class="clip media-fill" src="assets/clips/dunes.mp4" muted playsinline data-start="0" data-duration="6.35" data-track-index="0"></video></div>
            <div class="f11-lab sub">Chaleur excessive</div>
            <svg class="f11-stamp" id="f11-s2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#FF2D55" stroke-width="9"/><path d="M30 30 L70 70 M70 30 L30 70" stroke="#FF2D55" stroke-width="11" stroke-linecap="round"/></svg>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f11-eviter", T0 = 30.10;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f11 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f11-alors", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(30.15));
            tl.fromTo("#f11-title", { scale: 2.4, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, at(30.35));
            tl.fromTo("#f11-x", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, at(30.55));
            tl.fromTo("#f11-x", { scale: 1 }, { scale: 1.12, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, at(31.1));
            [[0, 31.12], [1, 31.23], [2, 31.52], [3, 31.62], [4, 31.77], [5, 32.17]].forEach(([k, t]) =>
              tl.fromTo("#f11-w" + k, { y: 40, opacity: 0, rotationX: -80 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.28, ease: "back.out(2.2)" }, at(t)));
            // two cards flip in, each gets stamped
            tl.fromTo("#f11-c1", { rotationY: -110, x: -120, opacity: 0, transformPerspective: 1400 }, { rotationY: 10, x: 0, opacity: 1, duration: 0.55, ease: "back.out(1.3)" }, at(32.70));
            tl.fromTo("#f11-s1", { scale: 2.6, opacity: 0, rotation: -30 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, at(33.55));
            tl.fromTo("#f11-c1", { rotationY: 10, scale: 1 }, { rotationY: 6, scale: 0.94, duration: 0.25, ease: "power2.out", immediateRender: false, transformPerspective: 1400 }, at(33.75));
            tl.fromTo("#f11-c2", { rotationY: 110, x: 120, opacity: 0, transformPerspective: 1400 }, { rotationY: -10, x: 0, opacity: 1, duration: 0.55, ease: "back.out(1.3)" }, at(34.45));
            tl.fromTo("#f11-s2", { scale: 2.6, opacity: 0, rotation: 30 }, { scale: 1, opacity: 1, rotation: 8, duration: 0.18, ease: "power4.in" }, at(35.50));
            tl.fromTo("#f11-c2", { rotationY: -10, scale: 1 }, { rotationY: -6, scale: 0.94, duration: 0.25, ease: "power2.out", immediateRender: false, transformPerspective: 1400 }, at(35.70));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
