<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f08-media { position: absolute; inset: 0; }
        #f08-tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,40,60,.78) 0%, rgba(0,90,120,.25) 40%, rgba(10,10,15,.55) 70%, #0A0A0F 100%); }
        #f08-perdu { position: absolute; left: 70px; top: 250px; font-size: 64px; }
        #f08-b { position: absolute; left: 66px; top: 340px; font-size: 170px; }
        #f08-word { position: absolute; left: 50px; top: 500px; width: 1000px; height: 440px; }
        #f08-out { position: absolute; left: 0; top: 0; font-size: 420px; color: transparent; -webkit-text-stroke: 6px #00D4FF; }
        #f08-fill { position: absolute; left: 0; top: 0; font-size: 420px; }
        .f08-sp { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #BFF4FF; box-shadow: 0 0 14px rgba(0,212,255,.9); opacity: 0; }
      </style>
      <div id="root" data-composition-id="f08-eau" data-width="1080" data-height="1920" data-duration="1.85">
        <div class="scene" id="f08">
          <div id="f08-media"><video id="f08-vid" class="clip media-fill" src="assets/clips/pour-high.mp4" muted playsinline data-start="0" data-duration="1.85" data-track-index="0"></video></div>
          <div id="f08-tint"></div>
          <div id="f08-perdu" class="sub">Tu as perdu</div>
          <div id="f08-b" class="disp ex c-white">Beaucoup</div>
          <div id="f08-word" class="p3d">
            <div id="f08-out" class="disp" data-fit="980">D'eau</div>
            <div id="f08-fill" class="disp ex c-water" data-fit="980">D'eau</div>
          </div>
          <div id="f08-sps"></div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f08-eau", T0 = 21.45;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          let s = 4242; const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
          const build = () => {
            document.querySelectorAll("#f08 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const sps = document.getElementById("f08-sps");
            for (let i = 0; i < 18; i++) { const d = document.createElement("i"); d.className = "f08-sp"; d.id = "f08-s" + i; sps.appendChild(d); }
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f08-media", { scale: 1.18 }, { scale: 1.0, duration: 1.85, ease: "power2.out" }, 0);
            tl.fromTo("#f08-perdu", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(21.5));
            tl.fromTo("#f08-b", { rotationX: -90, opacity: 0, transformOrigin: "50% 100%" }, { rotationX: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, at(22.32));
            tl.fromTo("#f08-out", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, at(22.50));
            // water rises inside the letters
            tl.fromTo("#f08-fill", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power2.inOut" }, at(22.66));
            tl.fromTo("#f08-word", { rotationY: -14 }, { rotationY: 8, duration: 1.0, ease: "sine.inOut" }, at(22.5));
            for (let i = 0; i < 18; i++) {
              const x = 120 + rnd() * 820, y = 900 + rnd() * 60, a = -Math.PI / 2 + (rnd() - .5) * 1.6, d = 160 + rnd() * 260;
              tl.fromTo("#f08-s" + i, { x: x, y: y, opacity: 1, scale: .6 + rnd() }, { x: x + Math.cos(a) * d, y: y + Math.sin(a) * d + 140, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, at(22.95 + rnd() * 0.15));
            }
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
