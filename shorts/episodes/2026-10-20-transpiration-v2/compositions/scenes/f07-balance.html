<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f07-q { position: absolute; left: 70px; top: 250px; font-size: 62px; }
        #f07-card { position: absolute; left: 90px; top: 360px; width: 860px; height: 560px; }
        #f07-photo { position: absolute; inset: 0; border-radius: 40px; overflow: hidden; border: 5px solid #F4F1EC; box-shadow: 0 50px 100px rgba(0,0,0,.6); }
        #f07-photo img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85) contrast(1.05); }
        #f07-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,0) 40%, rgba(10,10,15,.75)); }
        #f07-label { position: absolute; left: 40px; bottom: 26px; font-size: 140px; }
        #f07-lcd { position: absolute; left: 470px; top: 48px; width: 340px; height: 200px; border-radius: 26px; background: #0d1a14; border: 5px solid #2b3a33;
          box-shadow: 0 0 40px rgba(0,255,135,.25), inset 0 0 30px rgba(0,0,0,.6); }
        #f07-lcd .mono { position: absolute; left: 0; width: 330px; text-align: center; color: #7dffb9; }
        #f07-dash { top: 50px; font-size: 64px; letter-spacing: .12em; }
        #f07-arrowbox { position: absolute; left: 0; width: 330px; top: 18px; height: 170px; }
        #f07-pds { top: 140px; font-size: 26px; }
        #f07-big { position: absolute; left: 70px; top: 940px; font-size: 150px; }
        #f07-after { position: absolute; left: 74px; top: 1064px; color: var(--heat); font-size: 24px; }
      </style>
      <div id="root" data-composition-id="f07-balance" data-width="1080" data-height="1920" data-duration="3.35">
        <div class="scene" id="f07">
          <div id="f07-q" class="sub">Tu sais pourquoi…</div>
          <div id="f07-card" class="p3d">
            <div id="f07-photo"><img src="assets/stock/pixabay-photo-403585.jpg" alt="" /></div>
            <div id="f07-label" class="disp ex c-white">La balance</div>
            <div id="f07-lcd">
              <div id="f07-dash" class="mono">– – –</div>
              <svg id="f07-arrowbox" viewBox="0 0 330 170"><path id="f07-arrow" d="M165 14 V118 M120 78 L165 124 L210 78" fill="none" stroke="#7DFFB9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div id="f07-pds" class="mono">Poids</div>
            </div>
          </div>
          <div id="f07-big" class="disp ex c-wheat" data-fit="940">Moins de poids ?</div>
          <div id="f07-after" class="mono chip">Juste après ta séance</div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f07-balance", T0 = 18.10;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f07 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f07-q", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(18.18));
            tl.fromTo("#f07-card", { rotationY: -75, rotationX: 10, x: -300, z: -500, opacity: 0 }, { rotationY: -14, rotationX: 8, x: 0, z: 0, opacity: 1, duration: 0.6, ease: "back.out(1.3)" }, at(18.60));
            tl.fromTo("#f07-card", { rotationY: -14, rotationX: 8 }, { rotationY: 10, rotationX: 4, duration: 2.6, ease: "sine.inOut", immediateRender: false }, at(19.2));
            tl.fromTo("#f07-label", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, at(18.85));
            tl.fromTo("#f07-lcd", { scale: 0.4, opacity: 0, z: 200 }, { scale: 1, opacity: 1, z: 60, duration: 0.4, ease: "back.out(2)" }, at(19.05));
            // the display flickers, then only an arrow: no number on purpose
            tl.fromTo("#f07-dash", { opacity: 1 }, { opacity: 0.2, duration: 0.06, yoyo: true, repeat: 5, ease: "steps(1)", immediateRender: false }, at(19.25));
            tl.set("#f07-dash", { opacity: 0 }, at(19.62));
            tl.fromTo("#f07-arrow", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out" }, at(19.65));
            tl.fromTo("#f07-arrow", { y: 0 }, { y: 14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, at(20.0));
            tl.fromTo("#f07-big", { scale: 1.9, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, at(19.65));
            tl.fromTo("#f07-after", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(20.13));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
