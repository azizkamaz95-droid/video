<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/style/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f13-pour { position: absolute; left: 70px; top: 240px; font-size: 56px; }
        #f13-dur { position: absolute; left: 64px; top: 310px; font-size: 200px; }
        #f13-bar { position: absolute; left: 70px; top: 492px; width: 520px; height: 12px; border-radius: 6px; background: var(--green); transform-origin: 0% 50%; }
        #f13-conc { position: absolute; left: 70px; top: 530px; color: var(--green); }
        #f13-deck { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 70%; }
        .f13-card { position: absolute; left: 90px; width: 900px; height: 300px; border-radius: 30px; overflow: hidden; background: #15151f; border: 4px solid #2f3a35; box-shadow: 0 -10px 40px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55); }
        #f13-c1 { top: 610px; } #f13-c2 { top: 700px; } #f13-c3 { top: 790px; }
        .f13-band { position: absolute; left: 0; top: 0; width: 100%; height: 92px; display: flex; align-items: center; gap: 22px; padding: 0 28px; background: #15151f; z-index: 2; }
        .f13-num { width: 62px; height: 62px; border-radius: 50%; background: var(--green); color: #0A0A0F; display: flex; align-items: center; justify-content: center; font-family: "League Gothic", sans-serif; font-size: 52px; }
        .f13-name { font-size: 72px; }
        .f13-body { position: absolute; left: 0; top: 92px; width: 100%; height: 208px; overflow: hidden; }
        .f13-body img { width: 100%; height: 100%; object-fit: cover; }
        .f13-body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,15,.55), rgba(10,10,15,0) 45%); }
        #f13-cal { position: absolute; left: 40px; top: 20px; display: grid; grid-template-columns: repeat(7, 96px); gap: 14px; }
        #f13-cal i { position: relative; display: block; width: 96px; height: 76px; border-radius: 14px; background: #1f2a25; border: 3px solid #2f4a3c; }
        #f13-cal i b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #0A0A0F; background: var(--green); border-radius: 11px; font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 40px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="f13-cles" data-width="1080" data-height="1920" data-duration="7.63">
        <div class="scene" id="f13">
          <div id="f13-pour" class="sub">Pour perdre de la graisse</div>
          <div id="f13-dur" class="disp ex c-green" data-fit="940">Durablement</div>
          <div id="f13-bar"></div>
          <div id="f13-conc" class="mono chip"><i class="dot"></i>Concentre-toi sur</div>
          <div id="f13-deck" class="p3d">
            <div class="f13-card" id="f13-c1">
              <div class="f13-band"><span class="f13-num">1</span><span class="f13-name disp c-white">Ton alimentation</span></div>
              <div class="f13-body"><img src="assets/stock/pixabay-photo-2106825.jpg" alt="" style="object-position: 50% 45%" /></div>
            </div>
            <div class="f13-card" id="f13-c2">
              <div class="f13-band"><span class="f13-num">2</span><span class="f13-name disp c-white">Ton activité physique</span></div>
              <div class="f13-body"><video id="f13-vid" class="clip media-fill" src="assets/clips/run.mp4" muted playsinline data-start="0" data-duration="7.63" data-track-index="0" style="object-position: 50% 70%"></video></div>
            </div>
            <div class="f13-card" id="f13-c3">
              <div class="f13-band"><span class="f13-num">3</span><span class="f13-name disp c-white">La régularité</span></div>
              <div class="f13-body" style="background:#121a16"><div id="f13-cal"></div></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "f13-cles", T0 = 38.62;
          const at = (t) => +Math.max(0, t - T0).toFixed(3);
          const build = () => {
            document.querySelectorAll("#f13 [data-fit]").forEach((el) => {
              const base = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
            });
            const cal = document.getElementById("f13-cal");
            for (let i = 0; i < 14; i++) { const d = document.createElement("i"); d.innerHTML = '<b id="f13-k' + i + '">✓</b>'; cal.appendChild(d); }
            const tl = gsap.timeline({ paused: true });
            tl.fromTo("#f13-pour", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(38.67));
            tl.fromTo("#f13-dur", { rotationX: -90, opacity: 0, transformOrigin: "50% 100%" }, { rotationX: 0, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, at(39.66));
            tl.fromTo("#f13-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, at(40.0));
            tl.fromTo("#f13-conc", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at(40.52));
            // the deck: each key flips up from the floor and lands in front of the previous one
            tl.fromTo("#f13-deck", { rotationX: 10, rotationY: -8 }, { rotationX: 4, rotationY: 6, duration: 7.63, ease: "sine.inOut" }, 0);
            [["#f13-c1", 41.66], ["#f13-c2", 42.86], ["#f13-c3", 44.24]].forEach(([c, t]) => {
              tl.fromTo(c, { rotationX: -95, y: 260, z: -200, opacity: 0, transformOrigin: "50% 100%" }, { rotationX: 0, y: 0, z: 0, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, at(t));
            });
            // previous cards step back as the next arrives
            tl.fromTo("#f13-c1", { z: 0, opacity: 1 }, { z: -90, opacity: 0.8, duration: 0.4, ease: "power2.out", immediateRender: false }, at(42.86));
            tl.fromTo("#f13-c1", { z: -90 }, { z: -180, duration: 0.4, ease: "power2.out", immediateRender: false }, at(44.24));
            tl.fromTo("#f13-c2", { z: 0, opacity: 1 }, { z: -90, opacity: 0.85, duration: 0.4, ease: "power2.out", immediateRender: false }, at(44.24));
            for (let i = 0; i < 14; i++) tl.fromTo("#f13-k" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(3)" }, at(44.55 + i * 0.06));
            // "…de tes habitudes": the whole stack lights up
            ["#f13-c1", "#f13-c2", "#f13-c3"].forEach((c, i) =>
              tl.fromTo(c, { borderColor: "#2f3a35" }, { borderColor: "#00FF87", duration: 0.25, ease: "power1.out" }, at(45.19 + i * 0.06)));
            window.__timelines[ID] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
