<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Miniature transpiration</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/style/kit.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0F; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0F; }
      .hf-font-display { font-family: "League Gothic"; font-weight: 400; }
      .hf-font-sub { font-family: "Montserrat"; font-weight: 900; }
      .hf-font-mono { font-family: "IBM Plex Mono"; font-weight: 700; }
      .v { position: absolute; inset: 0; opacity: 0; }
      .bg { position: absolute; left: -60px; top: -80px; width: 1200px; height: 2080px; object-fit: cover; filter: blur(4px) brightness(.55) saturate(1.5); }
      .tint { position: absolute; inset: 0; background:
        radial-gradient(60% 34% at 50% 68%, rgba(255,107,53,.55), rgba(255,107,53,0) 70%),
        linear-gradient(180deg, rgba(10,10,15,.94) 0%, rgba(10,10,15,.7) 24%, rgba(10,10,15,.22) 46%, rgba(10,10,15,.3) 78%, rgba(10,10,15,.92) 100%); }
      .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
      .brand { position: absolute; left: 0; width: 1080px; top: 112px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      .brand img { width: 78px; height: 78px; border-radius: 18px; box-shadow: 0 10px 30px rgba(255,107,53,.4); }
      .brand span { font-size: 84px; }
      .t1 { position: absolute; left: 60px; top: 260px; font-size: 200px; }
      .t2 { position: absolute; left: 60px; top: 440px; font-size: 200px; }
      .glow { position: absolute; left: 80px; top: 1020px; width: 920px; height: 760px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,107,53,.4), rgba(255,107,53,0)); }
      .stk { position: absolute; } .stk img { width: 100%; height: 100%; display: block; }
      .stamp { position: absolute; border: 16px solid #FF2D55; border-radius: 26px; padding: 0 44px; color: #FF2D55; rotate: -9deg;
        box-shadow: 0 0 60px rgba(255,45,85,.5), inset 0 0 40px rgba(255,45,85,.25); background: rgba(10,10,15,.55); }
      .stamp .disp { font-size: 400px; line-height: .98; letter-spacing: .02em; }
      .chip { position: absolute; padding: 10px 26px; border-radius: 16px; background: rgba(10,10,15,.82); border: 3px solid #FF6B35; }
      .chip span { font-size: 54px; color: #F4F1EC; }
      #vA .stamp { left: 150px; top: 700px; }
      #vA .stk { left: 120px; top: 1050px; width: 900px; height: 900px; }
      #vA .chip { left: 60px; top: 1060px; rotate: -4deg; }
      #vB .stamp { left: 110px; top: 660px; }
      #vB .stamp .disp { font-size: 440px; }
      #vB .stk { left: -110px; top: 1090px; width: 880px; height: 880px; }
      #vB .chip { left: 520px; top: 1480px; rotate: 4deg; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <div class="v" id="vA">
        <img class="bg" src="img/heat.jpg" alt="" />
        <div class="tint"></div>
        <div class="brand"><img src="assets/brand/icon-512.png" alt="" /><span class="disp ex-sm c-wheat">CaliBodi</span></div>
        <div class="t1 disp ex c-white" data-fit="960">Plus tu transpires</div>
        <div class="t2 disp ex c-heat" data-fit="960">Plus tu maigris ?</div>
        <div class="stamp"><div class="disp">FAUX</div></div>
        <div class="glow"></div>
        <div class="stk"><img src="img/calix-non.png" alt="Calix dit non" /></div>
        <div class="vig"></div>
      </div>
      <div class="v" id="vB">
        <img class="bg" src="img/heat.jpg" alt="" />
        <div class="tint"></div>
        <div class="brand"><img src="assets/brand/icon-512.png" alt="" /><span class="disp ex-sm c-wheat">CaliBodi</span></div>
        <div class="t1 disp ex c-white" data-fit="960">Transpirer =</div>
        <div class="t2 disp ex c-heat" data-fit="960">perdre du gras ?</div>
        <div class="stamp"><div class="disp">FAUX</div></div>
        <div class="glow"></div>
        <div class="stk"><img src="img/calix-sceptique.png" alt="Calix sceptique" /></div>
        <div class="chip"><span class="mono">sueur ≠ gras</span></div>
        <div class="vig"></div>
      </div>
    </div>
    <script>
      (function () {
        const build = () => {
          document.querySelectorAll("[data-fit]").forEach((el) => {
            const base = parseFloat(getComputedStyle(el).fontSize);
            el.style.fontSize = window.__hyperframes.fitTextFontSize(el.textContent.toUpperCase(), { maxWidth: +el.dataset.fit - 12, fontFamily: '"League Gothic"', fontWeight: 400, baseFontSize: base, minFontSize: 60, step: 2 }).fontSize + "px";
          });
          const tl = gsap.timeline({ paused: true });
          tl.set("#vA", { opacity: 1 }, 0);
          tl.set("#vA", { opacity: 0 }, 1);
          tl.set("#vB", { opacity: 1 }, 1);
          window.__timelines["main"] = tl;
        };
        document.fonts.ready.then(build);
      })();
    </script>
  </body>
</html>
