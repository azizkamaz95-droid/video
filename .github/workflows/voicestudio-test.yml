# Test ponctuel de VoiceStudio (OmniVoice) : voix, rires, soupirs en français. Aucun secret, aucune publication.
# Se lance quand on pousse un changement dans voicetest/ sur la branche de travail, ou à la main.
name: Test VoiceStudio
on:
  push:
    branches: [claude/festive-einstein-2o3wzf]
    paths: ['voicetest/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: voicetest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer VoiceStudio (CPU)
        run: |
          git clone --depth 1 https://github.com/debpalash/voicestudio vs
          pip install --quiet torch torchaudio torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=5.10.0" accelerate pydub soundfile numpy tensorboardX webdataset huggingface_hub safetensors sentencepiece "setuptools<80" pillow
          pip install --quiet --no-deps -e vs
          # torchaudio.save demande torchcodec : on enregistre avec soundfile a la place
          python - <<'PY'
          import re
          p = "vs/omnivoice/cli/infer.py"
          s = open(p).read()
          old = "torchaudio.save(args.output, audios[0], model.sampling_rate)"
          assert old in s
          s = s.replace(old, "import soundfile as sf; sf.write(args.output, audios[0].squeeze().cpu().numpy(), model.sampling_rate)")
          open(p, "w").write(s)
          PY
          python -c "import omnivoice; print('omnivoice OK')"
      - name: Generer les phrases
        run: |
          mkdir -p out
          while IFS='|' read -r name lang instruct text; do
            [ -z "$name" ] && continue
            echo "=== $name : $text"
            args=(--model k2-fsa/OmniVoice --text "$text" --language "$lang" --output "out/$name.wav" --device cpu --num_step 16)
            [ -n "$instruct" ] && args+=(--instruct "$instruct")
            start=$(date +%s)
            omnivoice-infer "${args[@]}" 2>&1 | tail -8; [ -s "out/$name.wav" ] || echo "ECHEC : $name"
            echo "duree: $(( $(date +%s) - start )) s"
          done < voicetest/phrases.txt
          ls -la out
      - name: Resume
        if: always()
        run: ls -la out 2>/dev/null || echo "aucun fichier genere"
      - name: Deposer les fichiers audio sur la branche
        if: always()
        run: |
          mkdir -p voicetest-out
          cp out/*.wav voicetest-out/ 2>/dev/null || true
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add voicetest-out
          git commit -m "Resultats du test VoiceStudio (fichiers audio)" || echo "rien a deposer"
          git push origin HEAD:${{ github.ref_name }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voicestudio-test
          path: out/
          if-no-files-found: warn
