<template id="07-hydratation-template">
  <style>
    @font-face{font-family:"Inter";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/Inter-700.woff2") format("woff2");}
    @font-face{font-family:"Inter";font-weight:900;font-style:normal;font-display:block;src:url("assets/fonts/Inter-900.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-600.woff2") format("woff2");}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
    #c07-bg { position: absolute; inset: 0; background: radial-gradient(70% 90% at 20% 80%, #0b1a24 0%, #0A0A0F 65%); }
    #c07 { position: absolute; inset: 0; }
    #c07 .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
    #c07 .b { color: #00D4FF; }
    #c07-top { position: absolute; left: 106px; right: 106px; top: 58px; height: 30px; font-size: 18px; color: rgba(200,200,208,0.75); }
    #c07-top .r { position: absolute; right: 0; top: 0; }
    #c07-top .r b { color: #00D4FF; font-weight: 600; }
    #c07-rule { position: absolute; left: 106px; top: 100px; width: 1708px; height: 1px; background: #22222E; }
    #c07-prog { position: absolute; left: 106px; top: 1000px; width: 1708px; height: 2px; background: #22222E; }
    #c07-progfill { position: absolute; left: 0; top: 0; width: 1708px; height: 2px; background: #00D4FF; }
    #c07-col { position: absolute; left: 106px; top: 150px; width: 560px; height: 810px; border-radius: 44px; overflow: hidden; background: #0e0e18; border: 1px solid #22222E; }
    #c07-water { position: absolute; left: 0; top: 0; width: 560px; height: 900px; }
    #c07-body { position: absolute; left: 0; top: 40px; width: 560px; height: 860px; background: linear-gradient(180deg, #19dcff 0%, #0096c7 45%, #00507a 100%); }
    #c07-wave1, #c07-wave2 { position: absolute; left: 0; top: 0; width: 1120px; height: 44px; }
    #c07 .bub { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); }
    #c07 .tick { position: absolute; left: 0; width: 560px; height: 0; border-top: 2px dashed rgba(255,255,255,0.35); }
    #c07 .tick span { position: absolute; right: 18px; top: -40px; height: 32px; padding: 0 12px; border-radius: 9px; background: rgba(10,10,15,0.82); font-size: 16px; color: #fff; display: flex; align-items: center; }
    #c07-drop { position: absolute; left: 36px; top: 34px; width: 56px; height: 56px; }
    #c07-drop svg { width: 56px; height: 56px; stroke: #00D4FF; stroke-width: 1.8; fill: rgba(0,212,255,0.12); stroke-linecap: round; stroke-linejoin: round; }
    #c07-kicker { position: absolute; left: 760px; top: 196px; font-size: 22px; color: #00D4FF; font-weight: 600; }
    #c07 .eq { position: absolute; left: 760px; width: 620px; }
    #c07 .eq .lab { display: block; font-size: 16px; color: #a2a2b0; }
    #c07 .eq .num { display: block; margin-top: 6px; font-weight: 900; font-size: 92px; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
    #c07 .eq .num .op { color: #8a8a99; }
    #c07-e1 { top: 250px; }
    #c07-e2 { top: 392px; }
    #c07-e3 { top: 534px; }
    #c07-e4 { top: 690px; }
    #c07-e3 .num { color: #00D4FF; }
    #c07-sep { position: absolute; left: 760px; top: 670px; width: 560px; height: 1px; background: #22222E; }
    #c07-phone { position: absolute; left: 1388px; top: 128px; width: 432px; height: 826px; border-radius: 66px; background: #050507; padding: 14px; box-shadow: 0 0 0 2px #2a2a36, 0 50px 120px rgba(0,0,0,0.7), 0 0 90px rgba(0,212,255,0.14); }
    #c07-screen { position: relative; width: 404px; height: 798px; border-radius: 52px; overflow: hidden; background: #0A0A0F; }
    #c07-screen img { position: absolute; left: 0; top: 0; width: 404px; height: 798px; object-fit: cover; object-position: 50% 0%; }
    #c07-island { position: absolute; left: 50%; top: 26px; width: 110px; height: 30px; margin-left: -55px; border-radius: 15px; background: #000; }
  </style>

  <div id="root" data-composition-id="07-hydratation" data-width="1920" data-height="1080" data-duration="5">
    <div id="c07-bg" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
    <div id="c07">
      <div id="c07-top" class="mono"><span>CaliBodi</span><span class="r"><b>04</b> / 04 · Hydratation</span></div>
      <div id="c07-rule"></div>
      <div id="c07-prog"><div id="c07-progfill"></div></div>

      <div id="c07-col">
        <div id="c07-water">
          <svg id="c07-wave2" viewBox="0 0 1120 44" preserveAspectRatio="none"><path id="c07-wp2" fill="rgba(25,220,255,0.45)" d=""/></svg>
          <svg id="c07-wave1" viewBox="0 0 1120 44" preserveAspectRatio="none"><path id="c07-wp1" fill="#19dcff" d=""/></svg>
          <div id="c07-body"></div>
        </div>
        <div id="c07-t1" class="tick" style="top:178px;"><span class="mono">2 730 ml</span></div>
        <div id="c07-t2" class="tick" style="top:62px;"><span class="mono">3 230 ml</span></div>
        <div id="c07-drop"><svg viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></div>
      </div>

      <div id="c07-kicker" class="mono">04 — Hydratation</div>
      <div id="c07-e1" class="eq"><span class="lab mono">Ton poids</span><span class="num">78 kg</span></div>
      <div id="c07-e2" class="eq"><span class="lab mono">Par kilo</span><span class="num"><span class="op">×</span> 35 ml</span></div>
      <div id="c07-e3" class="eq"><span class="lab mono">Ton objectif</span><span id="c07-goal" class="num"><span class="op">=</span> 2 730 ml</span></div>
      <div id="c07-sep"></div>
      <div id="c07-e4" class="eq"><span class="lab mono b">Après ta séance</span><span class="num"><span class="op">+</span> 500 ml</span></div>

      <div id="c07-phone"><div id="c07-screen"><img src="assets/app/hydration.png" alt="" /></div><div id="c07-island"></div></div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const wave = (amp, phase) => {
        let d = "M0 44 L0 22";
        for (let x = 0; x <= 1120; x += 10) d += ` L${x} ${(22 + amp * Math.sin((x / 280) * Math.PI * 2 + phase)).toFixed(2)}`;
        return d + " L1120 44 Z";
      };
      document.getElementById("c07-wp1").setAttribute("d", wave(9, 0));
      document.getElementById("c07-wp2").setAttribute("d", wave(12, 1.6));
      const water = document.getElementById("c07-water");
      const seeds = [[60, 14, 0.9], [150, 10, 1.4], [240, 18, 1.1], [330, 12, 2.0], [420, 9, 1.7], [490, 15, 2.4], [110, 8, 2.8], [380, 11, 3.1], [200, 13, 3.4], [300, 9, 0.7]];
      seeds.forEach(([x, r, t], i) => {
        const b = document.createElement("div");
        b.className = "bub"; b.id = `c07-bb${i}`;
        b.style.left = x + "px"; b.style.top = "860px"; b.style.width = r + "px"; b.style.height = r + "px";
        water.appendChild(b);
      });

      const H = 810, lvl = (ml) => H - (ml / 3500) * H;
      tl.fromTo("#c07-progfill", { scaleX: 0 }, { scaleX: 1, duration: 5, ease: "none", transformOrigin: "0% 50%" }, 0);
      tl.fromTo(["#c07-top", "#c07-rule"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo("#c07-col", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.2);
      tl.fromTo("#c07-wave1", { x: 0 }, { x: -560, duration: 5, ease: "none" }, 0);
      tl.fromTo("#c07-wave2", { x: -280 }, { x: 0, duration: 5, ease: "none" }, 0);
      tl.fromTo("#c07-water", { y: H }, { y: lvl(900) - 22, duration: 0.8, ease: "power2.out" }, 0.4);
      tl.to("#c07-water", { y: lvl(2730) - 22, duration: 0.9, ease: "power3.inOut" }, 1.75);
      tl.to("#c07-water", { y: lvl(3230) - 22, duration: 0.8, ease: "power3.inOut" }, 3.1);
      tl.fromTo("#c07-t1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 2.1);
      tl.fromTo("#c07-t2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 3.4);
      tl.fromTo("#c07-drop", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.45);
      seeds.forEach(([, , t], i) => {
        tl.fromTo(`#c07-bb${i}`, { y: 0, opacity: 0.9 }, { y: -760, opacity: 0, duration: 2.2, ease: "power1.in" }, t);
      });

      tl.fromTo("#c07-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.3);
      [["#c07-e1", 1.15], ["#c07-e2", 1.65], ["#c07-e3", 2.05]].forEach(([e, t]) => {
        tl.fromTo(e, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, t);
      });
      tl.fromTo("#c07-sep", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%" }, 2.95);
      tl.fromTo("#c07-e4", { opacity: 0, y: 34, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(2)", transformOrigin: "0% 50%" }, 3.05);
      const goal = document.getElementById("c07-goal");
      const g = { v: 2730 };
      tl.fromTo(g, { v: 2730 }, {
        v: 3230, duration: 0.8, ease: "power3.inOut",
        onUpdate() { const v = Math.round(g.v / 10) * 10; goal.innerHTML = `<span class="op">=</span> ${String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ")} ml`; },
      }, 3.25);

      tl.fromTo("#c07-phone", { y: 260, rotation: 6, opacity: 0 }, { y: 0, rotation: 2.5, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.55);
      tl.to("#c07-phone", { y: -12, duration: 2.4, ease: "sine.inOut" }, 1.6);

      window.__timelines["07-hydratation"] = tl;
    })();
  </script>
</template>
