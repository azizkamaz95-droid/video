  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const segs = document.getElementById("c04-segs");
      for (let i = 0; i < 10; i++) {
        const s = document.createElement("div");
        s.className = "seg"; s.style.left = (i * 70) + "px";
        s.innerHTML = `<i id="c04-sg${i}"></i>`;
        segs.appendChild(s);
      }
      const wave = document.getElementById("c04-wave");
      for (let i = 0; i < 12; i++) {
        const b = document.createElement("b");
        b.id = `c04-wb${i}`; b.style.left = (i * 9) + "px";
        wave.appendChild(b);
      }

      // ambient
      tl.fromTo("#c04-photo img", { scale: 1.12 }, { scale: 1.0, duration: 8.5, ease: "none" }, 0);
      tl.fromTo("#c04-progfill", { scaleX: 0 }, { scaleX: 1, duration: 8.5, ease: "none", transformOrigin: "0% 50%" }, 0);
      tl.fromTo(["#c04-top", "#c04-rule"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);

      // phase A — séances guidées
      tl.fromTo("#c04-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.2);
      tl.fromTo("#c04-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.42);
      tl.fromTo("#c04-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.78);
      tl.set(["#c04-l3", "#c04-l4"], { yPercent: 110 }, 0);

      tl.fromTo("#c04-phone", { y: 260, rotation: 7, opacity: 0 }, { y: 0, rotation: -2.5, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.25);
      tl.to("#c04-phone", { y: -14, duration: 2.0, ease: "sine.inOut" }, 1.3);
      tl.to("#c04-phone", { y: 6, duration: 2.6, ease: "sine.inOut" }, 3.3);
      tl.to("#c04-phone", { y: -10, duration: 2.5, ease: "sine.inOut" }, 5.9);

      [["#c04-cardA", "#c04-labA", 0.9, -8], ["#c04-cardB", "#c04-labB", 1.15, 6], ["#c04-cardC", "#c04-labC", 1.4, -5]].forEach(([c, l, t, r]) => {
        tl.fromTo(c, { scale: 0.4, opacity: 0, rotation: r * 2 }, { scale: 1, opacity: 1, rotation: r, duration: 0.7, ease: "back.out(1.6)" }, t);
        tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, t + 0.3);
        tl.to(c, { y: -12, duration: 1.6, ease: "sine.inOut" }, t + 0.7);
        tl.to([c, l], { opacity: 0, scale: 0.6, y: 40, duration: 0.4, ease: "power3.in" }, 4.3);
      });

      [["#c04-chip1", 1.82], ["#c04-chip2", 2.43], ["#c04-chip3", 3.2]].forEach(([c, t]) => {
        tl.fromTo(c, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t);
      });

      // phase B — Calix te pousse
      tl.to(["#c04-chip1", "#c04-chip2", "#c04-chip3"], { opacity: 0, x: -30, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 4.32);
      tl.to("#c04-l1", { yPercent: -110, duration: 0.45, ease: "power3.in" }, 4.3);
      tl.to("#c04-l2", { yPercent: -110, duration: 0.45, ease: "power3.in" }, 4.36);
      tl.to("#c04-l3", { yPercent: -100, duration: 0.7, ease: "expo.out" }, 4.62);
      tl.to("#c04-l4", { yPercent: -100, duration: 0.7, ease: "expo.out" }, 6.12);

      tl.fromTo("#c04-scr2", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "expo.inOut" }, 4.4);
      tl.fromTo("#c04-calix", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 4.55);
      for (let i = 0; i < 12; i++) {
        tl.set(`#c04-wb${i}`, { scaleY: 0.15, transformOrigin: "50% 100%" }, 0);
        for (let k = 0; k < 14; k++) {
          const h = 0.2 + 0.8 * Math.abs(Math.sin(i * 1.7 + k * 2.3)) * (0.55 + 0.45 * Math.abs(Math.sin(k * 0.9)));
          tl.to(`#c04-wb${i}`, { scaleY: h, duration: 0.12, ease: "sine.inOut" }, 4.7 + k * 0.12);
        }
        tl.to(`#c04-wb${i}`, { scaleY: 0.15, duration: 0.2, ease: "sine.out" }, 4.7 + 14 * 0.12);
      }

      tl.fromTo("#c04-reps", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 5.2);
      for (let i = 0; i < 10; i++) tl.set(`#c04-sg${i}`, { scaleX: 0, transformOrigin: "0% 50%" }, 0);
      for (let i = 0; i < 7; i++) tl.to(`#c04-sg${i}`, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 5.3 + i * 0.05);
      const num = document.getElementById("c04-repnum");
      const counts = [[6.28, 8], [6.62, 9], [7.0, 10]];
      const rep = { v: 7 };
      const paint = () => { num.textContent = String(Math.round(rep.v)).padStart(2, "0"); };
      counts.forEach(([t, v]) => {
        tl.fromTo(rep, { v: v - 1 }, { v, duration: 0.01, ease: "none", onUpdate: paint, immediateRender: false }, t);
      });
      counts.forEach(([t, v]) => {
        tl.fromTo("#c04-repnum", { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "back.out(2)", transformOrigin: "0% 60%", immediateRender: false }, t);
        tl.to(`#c04-sg${v - 1}`, { scaleX: 1, duration: 0.2, ease: "power2.out" }, t);
      });
      tl.fromTo("#c04-done", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 7.15);

      window.__timelines["04-sport"] = tl;
    })();
  </script>
