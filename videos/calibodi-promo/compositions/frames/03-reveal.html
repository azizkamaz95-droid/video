  <style>

        radial-gradient(closest-side at 38% 52%, rgba(255,140,40,0.42), rgba(255,140,40,0) 100%),

        radial-gradient(closest-side at 63% 40%, rgba(61,155,255,0.36), rgba(61,155,255,0) 100%); }

    #c03-iconwrap { position: absolute; left: 810px; top: 240px; width: 300px; height: 300px; border-radius: 70px; overflow: hidden; box-shadow: 0 0 120px rgba(255,90,60,0.45), 0 40px 80px rgba(0,0,0,0.6); }
    #c03-icon { display: block; width: 300px; height: 300px; }
    #c03-sheen { position: absolute; left: -200px; top: -100px; width: 140px; height: 520px; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%); }
    #c03-orbit { position: absolute; left: 960px; top: 390px; width: 0; height: 0; }
    #c03-orbitline { position: absolute; left: -238px; top: -238px; width: 476px; height: 476px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.16); }
    #c03 .dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; }
    #c03-word { position: absolute; left: 0; right: 0; top: 590px; height: 210px; text-align: center; overflow: hidden; font-weight: 900; font-size: 196px; line-height: 210px; letter-spacing: -0.05em; white-space: nowrap; }
    #c03-word .c { display: inline-block; }
    #c03-tag { position: absolute; left: 0; right: 0; top: 836px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #C8C8D0; white-space: pre; }
  </style>

  <div data-hf-id="hf-gl0s" id="root" data-composition-id="03-reveal" data-width="1920" data-height="1080" data-duration="5.5">
    <div data-hf-id="hf-xr4m" id="c03-bg" class="clip" data-start="0" data-duration="5.5" data-track-index="0"></div>
    <div data-hf-id="hf-3nkv" id="c03">
      <div data-hf-id="hf-n1yb" id="c03-glow"></div>
      <div data-hf-id="hf-e8n2" id="c03-shock"><div data-hf-id="hf-hx6m" id="c03-ring"></div><div data-hf-id="hf-3g7k" id="c03-ring2"></div></div>
      <div data-hf-id="hf-vp2o" id="c03-orbit">
        <div data-hf-id="hf-4aom" id="c03-orbitline"></div>
        <div data-hf-id="hf-ugq4" id="c03-d0" class="dot" style="left:0px; top:-238px; background:#FF6B35; box-shadow:0 0 24px #FF6B35;"></div>
        <div data-hf-id="hf-py3k" id="c03-d1" class="dot" style="left:238px; top:0px; background:#00FF87; box-shadow:0 0 24px #00FF87;"></div>
        <div data-hf-id="hf-qntr" id="c03-d2" class="dot" style="left:0px; top:238px; background:#BF5AF2; box-shadow:0 0 24px #BF5AF2;"></div>
        <div data-hf-id="hf-g5z5" id="c03-d3" class="dot" style="left:-238px; top:0px; background:#00D4FF; box-shadow:0 0 24px #00D4FF;"></div>
      </div>
      <div data-hf-id="hf-3tqb" id="c03-iconwrap"><img data-hf-id="hf-e68t" id="c03-icon" src="assets/brand/icon-512.png" alt="" /><div data-hf-id="hf-icer" id="c03-sheen"></div></div>
      <div data-hf-id="hf-5ed4" id="c03-word"><span data-hf-id="hf-mttp" class="c">C</span><span data-hf-id="hf-0c8n" class="c">a</span><span data-hf-id="hf-5i80" class="c">l</span><span data-hf-id="hf-3iov" class="c">i</span><span data-hf-id="hf-n84q" class="c">B</span><span data-hf-id="hf-4bax" class="c">o</span><span data-hf-id="hf-2brs" class="c">d</span><span data-hf-id="hf-qmlb" class="c">i</span></div>
      <div data-hf-id="hf-b8zw" id="c03-tag">COACH FITNESS IA</div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#c03-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" }, 0.0);
      tl.to("#c03-glow", { scale: 1.08, duration: 4.0, ease: "sine.inOut" }, 1.2);
      tl.fromTo("#c03-ring", { scale: 0.6, opacity: 1 }, { scale: 6.5, opacity: 0, duration: 1.0, ease: "expo.out" }, 0.0);
      tl.fromTo("#c03-ring2", { scale: 0.6, opacity: 0.8 }, { scale: 4.2, opacity: 0, duration: 1.3, ease: "expo.out" }, 0.08);

      tl.fromTo("#c03-iconwrap", { scale: 0.15, rotation: -14, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, 0.0);
      tl.to("#c03-iconwrap", { scale: 1.04, duration: 3.6, ease: "sine.inOut" }, 0.9);
      tl.fromTo("#c03-sheen", { x: 0, rotation: 18 }, { x: 760, rotation: 18, duration: 0.8, ease: "power2.inOut" }, 0.95);

      const chars = gsap.utils.toArray("#c03-word .c");
      chars.forEach((c, i) => {
        tl.fromTo(c, { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.82 + i * 0.045);
      });

      const tag = document.getElementById("c03-tag");
      const target = "COACH FITNESS IA";
      const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*/+";
      const prog = { p: 0 };
      tl.fromTo(prog, { p: 0 }, {
        p: 1, duration: 0.85, ease: "none",
        onUpdate() {
          const p = prog.p, n = Math.floor(p * target.length), frame = Math.floor(p * 36);
          let out = "";
          for (let i = 0; i < target.length; i++) {
            const ch = target[i];
            if (i < n || ch === " ") out += ch;
            else if (i < n + 5) out += pool[(i * 31 + frame * 17) % pool.length];
            else out += " ";
          }
          tag.textContent = out;
        },
      }, 1.98);
      tl.fromTo("#c03-tag", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.98);

      tl.fromTo("#c03-orbitline", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, 3.9);
      ["#c03-d0", "#c03-d1", "#c03-d2", "#c03-d3"].forEach((d, i) => {
        tl.fromTo(d, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 3.98 + i * 0.11);
      });
      tl.fromTo("#c03-orbit", { rotation: -30 }, { rotation: 60, duration: 1.6, ease: "power1.out" }, 3.9);

      tl.to(["#c03-word", "#c03-tag"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.3, ease: "power3.in", stagger: 0.04 }, 5.05);
      tl.to(["#c03-iconwrap", "#c03-orbit"], { scale: 1.6, opacity: 0, duration: 0.36, ease: "power3.in" }, 5.08);
      window.__timelines["03-reveal"] = tl;
    })();
  </script>
</template>
