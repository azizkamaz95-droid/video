  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const week = document.getElementById("c08-week");
      ["L", "M", "M", "J", "V", "S", "D"].forEach((d, i) => {
        const el = document.createElement("div");
        el.className = "day"; el.id = `c08-d${i}`;
        el.innerHTML = `<i id="c08-df${i}"></i><span>${d}</span>`;
        week.appendChild(el);
      });
      const P = [[520, 300], [1400, 300], [1400, 760], [520, 760]];
      const CX = 960, CY = 470;

      tl.fromTo("#c08-bg", { opacity: 0.6 }, { opacity: 1, duration: 1.0, ease: "none" }, 0);
      const cues = [0.32, 1.12, 2.08, 3.24];
      cues.forEach((t, i) => {
        tl.fromTo(`#c08-n${i} .ring`, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, t);
        tl.fromTo(`#c08-n${i} .lab`, { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, t + 0.06);
      });

      const edges = ["#c08-e01", "#c08-e12", "#c08-e23", "#c08-e30", "#c08-e20", "#c08-e13"];
      edges.forEach((e, i) => {
        const el = document.querySelector(e);
        const len = Math.hypot(el.x2.baseVal.value - el.x1.baseVal.value, el.y2.baseVal.value - el.y1.baseVal.value);
        el.setAttribute("stroke-dasharray", `${len} ${len}`);
        tl.fromTo(e, { attr: { "stroke-dashoffset": len }, opacity: 1 }, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, 4.28 + i * 0.07);
      });
      [["#c08-l1", 4.62], ["#c08-l2", 4.72], ["#c08-l3", 4.82]].forEach(([l, t]) => {
        tl.fromTo(l, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, t);
      });
      const trips = [[2, 0], [0, 3], [0, 1], [1, 2]];
      trips.forEach(([a, b], i) => {
        tl.fromTo(`#c08-pk${i}`, { x: 0, y: 0, opacity: 0 }, { x: P[b][0] - P[a][0], y: P[b][1] - P[a][1], opacity: 1, duration: 0.6, ease: "power1.inOut" }, 4.55 + i * 0.08);
      });

      // converge into one score
      const out = 5.2;
      tl.to(edges.concat(["#c08-l1", "#c08-l2", "#c08-l3", "#c08-pk0", "#c08-pk1", "#c08-pk2", "#c08-pk3"]), { opacity: 0, duration: 0.3, ease: "power2.in" }, out);
      P.forEach(([x, y], i) => {
        tl.to(`#c08-n${i}`, { x: CX - x, y: CY - y, scale: 0.25, opacity: 0, duration: 0.55, ease: "power3.in" }, out + i * 0.03);
      });
      tl.fromTo("#c08-score", { scale: 0.55, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.8, ease: "expo.out" }, 5.62);
      const fills = [1.0, 0.92, 0.84, 0.78];
      [262, 222, 182, 142].forEach((r, i) => {
        const c = 2 * Math.PI * r;
        const el = document.getElementById(`c08-a${i}`);
        el.setAttribute("stroke-dasharray", `${c} ${c}`);
        tl.fromTo(el, { attr: { "stroke-dashoffset": c } }, { attr: { "stroke-dashoffset": c * (1 - fills[i]) }, duration: 1.1, ease: "power3.out" }, 5.75 + i * 0.07);
      });
      const num = document.getElementById("c08-num");
      const s = { v: 0 };
      tl.fromTo(s, { v: 0 }, { v: 87, duration: 1.0, ease: "power3.out", onUpdate() { num.textContent = Math.round(s.v); } }, 5.85);
      tl.fromTo("#c08-numlab", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.1);

      tl.fromTo("#c08-week", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 6.7);
      for (let i = 0; i < 7; i++) {
        tl.fromTo(`#c08-df${i}`, { yPercent: 100 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, 6.88 + i * 0.09);
      }
      tl.fromTo("#c08-streak", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.35);
      tl.to("#c08-score", { scale: 1.03, duration: 1.5, ease: "sine.inOut" }, 6.45);

      window.__timelines["08-connecte"] = tl;
    })();
  </script>
