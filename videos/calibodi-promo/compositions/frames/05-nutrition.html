      });
      tl.fromTo("#c05-cap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.85);

      tl.fromTo("#c05-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.3);

        tl.fromTo(m, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 4.22 + i * 0.1);
        tl.fromTo(f, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out", transformOrigin: "0% 50%" }, 4.3 + i * 0.1);

      tl.to("#c05-colin", { y: 440 - 56 - HL * STEP - 40, duration: 3.0, ease: "none" }, 6.95);
