        for (let k = i + 1; k < words.length; k++) {
          const depth = k - i;
          tl.to(w, { y: BASE - depth * S, opacity: fade[depth], duration: 0.5, ease: "expo.out" }, cues[k]);

      jitter.forEach(([dx, dy], i) => {

        tl.to("#c01-cluster", { x: dx * k, y: dy * k, duration: 0.07, ease: "none" }, 6.3 + i * 0.08);
      });
      tl.to("#c01-cluster", { x: 0, y: 0, duration: 0.06, ease: "none" }, 7.42);
