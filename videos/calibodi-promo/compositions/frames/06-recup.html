  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const X0 = 110, W = 544;
      const lv = [8, 38, 68, 98];
      const night = [[0, 0], [0.04, 2], [0.12, 3], [0.22, 2], [0.28, 1], [0.33, 2], [0.42, 3], [0.5, 2], [0.58, 1], [0.64, 2], [0.72, 1], [0.79, 0], [0.82, 2], [0.9, 1], [1.0, 0]];
      let d = "";
      night.forEach(([t, l], i) => {
        const x = X0 + t * W, y = lv[l];
        if (i === 0) d += `M${x} ${y}`;
        else { const py = lv[night[i - 1][1]]; d += ` L${x} ${py} L${x} ${y}`; }
      });
      document.getElementById("c06-hline").setAttribute("d", d);
      document.getElementById("c06-harea").setAttribute("d", d + ` L${X0 + W} 104 L${X0} 104 Z`);

      tl.fromTo("#c06-progfill", { scaleX: 0 }, { scaleX: 1, duration: 6.5, ease: "none", transformOrigin: "0% 50%" }, 0);
      tl.fromTo(["#c06-top", "#c06-rule"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo("#c06-photo img", { scale: 1.14 }, { scale: 1.0, duration: 6.5, ease: "none" }, 0);

      tl.fromTo("#c06-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.2);
      tl.fromTo("#c06-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.36);
      tl.fromTo("#c06-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.72);
      tl.set(["#c06-l3", "#c06-l4"], { yPercent: 110 }, 0);

      tl.fromTo("#c06-c1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 1.0);
      tl.fromTo("#c06-cliprect", { attr: { width: 0 } }, { attr: { width: 654 }, duration: 0.9, ease: "power2.inOut" }, 1.15);
      const sc = document.getElementById("c06-score");
      const s = { v: 0 };
      tl.fromTo(s, { v: 0 }, { v: 40, duration: 0.6, ease: "power2.out", onUpdate() { sc.textContent = Math.round(s.v); } }, 1.55);

      tl.fromTo("#c06-phone", { y: 260, rotation: -6, opacity: 0 }, { y: 0, rotation: -2, opacity: 1, duration: 1.0, ease: "expo.out" }, 1.55);
      tl.to("#c06-phone", { y: -12, duration: 2.4, ease: "sine.inOut" }, 2.6);

      tl.fromTo("#c06-c2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 2.45);
      tl.fromTo("#c06-intfill", { scaleX: 1 }, { scaleX: 0.7, duration: 0.9, ease: "power3.inOut", transformOrigin: "0% 50%" }, 2.7);
      tl.fromTo("#c06-knob", { x: 0 }, { x: -141, duration: 0.9, ease: "power3.inOut" }, 2.7);
      const iv = document.getElementById("c06-intval");
      const it = { v: 100 };
      tl.fromTo(it, { v: 100 }, { v: 70, duration: 0.9, ease: "power3.inOut", immediateRender: false, onUpdate() { iv.textContent = Math.round(it.v) + "%"; } }, 2.7);
      tl.fromTo("#c06-tag", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)", transformOrigin: "0% 50%" }, 3.5);

      tl.to("#c06-l1", { yPercent: -110, duration: 0.42, ease: "power3.in" }, 4.95);
      tl.to("#c06-l2", { yPercent: -110, duration: 0.42, ease: "power3.in" }, 5.0);
      tl.to("#c06-l3", { yPercent: -100, duration: 0.7, ease: "expo.out" }, 5.24);
      tl.to("#c06-l4", { yPercent: -100, duration: 0.7, ease: "expo.out" }, 5.36);

      window.__timelines["06-recup"] = tl;
    })();
  </script>
