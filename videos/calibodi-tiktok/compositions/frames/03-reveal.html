<template id="03-reveal-template">
  <style>
    @font-face{font-family:"Inter";font-weight:900;font-style:normal;font-display:block;src:url("assets/fonts/Inter-900.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-600.woff2") format("woff2");}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
    #v03-bg { position: absolute; inset: 0; background: #0A0A0F; }
    #v03 { position: absolute; inset: 0; }
    #v03-glow { position: absolute; left: -210px; top: 70px; width: 1500px; height: 1300px;
      background:
        radial-gradient(closest-side at 38% 52%, rgba(255,140,40,0.42), rgba(255,140,40,0) 100%),
        radial-gradient(closest-side at 50% 48%, rgba(255,45,85,0.40), rgba(255,45,85,0) 100%),
        radial-gradient(closest-side at 63% 40%, rgba(61,155,255,0.36), rgba(61,155,255,0) 100%); }
    #v03-shock { position: absolute; left: 540px; top: 670px; width: 0; height: 0; }
    #v03-ring { position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.9); }
    #v03-ring2 { position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); }
    #v03-iconwrap { position: absolute; left: 390px; top: 520px; width: 300px; height: 300px; border-radius: 70px; overflow: hidden; box-shadow: 0 0 120px rgba(255,90,60,0.45), 0 40px 80px rgba(0,0,0,0.6); }
    #v03-icon { display: block; width: 300px; height: 300px; }
    #v03-sheen { position: absolute; left: -200px; top: -100px; width: 140px; height: 520px; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%); }
    #v03-orbit { position: absolute; left: 540px; top: 670px; width: 0; height: 0; }
    #v03-orbitline { position: absolute; left: -238px; top: -238px; width: 476px; height: 476px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.16); }
    #v03 .dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; }
    #v03-word { position: absolute; left: 0; right: 0; top: 960px; height: 200px; text-align: center; overflow: hidden; font-weight: 900; font-size: 182px; line-height: 200px; letter-spacing: -0.05em; white-space: nowrap; }
    #v03-word .c { display: inline-block; }
    #v03-tag { position: absolute; left: 0; right: 0; top: 1196px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 28px; letter-spacing: 0.32em; color: #C8C8D0; white-space: pre; }
  </style>

  <div id="root" data-composition-id="03-reveal" data-width="1080" data-height="1920" data-duration="5.5">
    <div id="v03-bg" class="clip" data-start="0" data-duration="5.5" data-track-index="0"></div>
    <div id="v03">
      <div id="v03-glow"></div>
      <div id="v03-shock"><div id="v03-ring"></div><div id="v03-ring2"></div></div>
      <div id="v03-orbit">
        <div id="v03-orbitline"></div>
        <div id="v03-d0" class="dot" style="left:0px; top:-238px; background:#FF6B35; box-shadow:0 0 24px #FF6B35;"></div>
        <div id="v03-d1" class="dot" style="left:238px; top:0px; background:#00FF87; box-shadow:0 0 24px #00FF87;"></div>
        <div id="v03-d2" class="dot" style="left:0px; top:238px; background:#BF5AF2; box-shadow:0 0 24px #BF5AF2;"></div>
        <div id="v03-d3" class="dot" style="left:-238px; top:0px; background:#00D4FF; box-shadow:0 0 24px #00D4FF;"></div>
      </div>
      <div id="v03-iconwrap"><img id="v03-icon" src="assets/brand/icon-512.png" alt="" /><div id="v03-sheen"></div></div>
      <div id="v03-word"><span class="c">C</span><span class="c">a</span><span class="c">l</span><span class="c">i</span><span class="c">B</span><span class="c">o</span><span class="c">d</span><span class="c">i</span></div>
      <div id="v03-tag">COACH FITNESS IA</div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#v03-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" }, 0.0);
      tl.to("#v03-glow", { scale: 1.08, duration: 4.0, ease: "sine.inOut" }, 1.2);
      tl.fromTo("#v03-ring", { scale: 0.6, opacity: 1 }, { scale: 6.5, opacity: 0, duration: 1.0, ease: "expo.out" }, 0.0);
      tl.fromTo("#v03-ring2", { scale: 0.6, opacity: 0.8 }, { scale: 4.2, opacity: 0, duration: 1.3, ease: "expo.out" }, 0.08);
      tl.fromTo("#v03-iconwrap", { scale: 0.15, rotation: -14, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, 0.0);
      tl.to("#v03-iconwrap", { scale: 1.04, duration: 3.6, ease: "sine.inOut" }, 0.9);
      tl.fromTo("#v03-sheen", { x: 0, rotation: 18 }, { x: 760, rotation: 18, duration: 0.8, ease: "power2.inOut" }, 0.95);

      gsap.utils.toArray("#v03-word .c").forEach((c, i) => {
        tl.fromTo(c, { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.82 + i * 0.045);
      });

      const tag = document.getElementById("v03-tag");
      const target = "COACH FITNESS IA";
      const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*/+";
      const prog = { p: 0 };
      tl.fromTo(prog, { p: 0 }, {
        p: 1, duration: 0.85, ease: "none",
        onUpdate() {
          const p = prog.p, n = Math.floor(p * target.length), frame = Math.floor(p * 36);
          let out = "";
          for (let i = 0; i < target.length; i++) {
            const ch = target[i];
            if (i < n || ch === " ") out += ch;
            else if (i < n + 5) out += pool[(i * 31 + frame * 17) % pool.length];
            else out += " ";
          }
          tag.textContent = out;
        },
      }, 1.98);
      tl.fromTo("#v03-tag", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.98);

      tl.fromTo("#v03-orbitline", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, 3.9);
      ["#v03-d0", "#v03-d1", "#v03-d2", "#v03-d3"].forEach((d, i) => {
        tl.fromTo(d, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 3.98 + i * 0.11);
      });
      tl.fromTo("#v03-orbit", { rotation: -30 }, { rotation: 60, duration: 1.6, ease: "power1.out" }, 3.9);

      tl.to(["#v03-word", "#v03-tag"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.3, ease: "power3.in", stagger: 0.04 }, 5.05);
      tl.to(["#v03-iconwrap", "#v03-orbit"], { scale: 1.6, opacity: 0, duration: 0.36, ease: "power3.in" }, 5.08);
      window.__timelines["03-reveal"] = tl;
    })();
  </script>
</template>
