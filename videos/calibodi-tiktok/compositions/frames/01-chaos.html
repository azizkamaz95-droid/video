  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const S = 150, BASE = 770;

      tl.fromTo("#v01", { scale: 1 }, { scale: 1.04, duration: 7.5, ease: "none", transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#v01-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);

      const words = ["#v01-w1", "#v01-w2", "#v01-w3", "#v01-w4"];
      const cues = [0.72, 2.18, 3.66, 5.36];
      const fade = [1, 0.42, 0.18, 0.08];
      words.forEach((w, i) => {
        tl.fromTo(w, { y: BASE + 70, opacity: 0, filter: "blur(14px)" },
          { y: BASE, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, cues[i]);
        for (let k = i + 1; k < words.length; k++) {
          const depth = k - i;
          tl.to(w, { y: BASE - depth * S, opacity: fade[depth], duration: 0.5, ease: "expo.out" }, cues[k]);
        }
      });

      [["#v01-t1", -7, 0.62], ["#v01-t2", 6, 2.08], ["#v01-t3", 5, 3.56]].forEach(([t, r, c]) => {
        tl.fromTo(t, { y: -170, opacity: 0, rotation: r - 22, scale: 0.7 },
          { y: 0, opacity: 1, rotation: r, scale: 1, duration: 0.75, ease: "back.out(1.5)" }, c);
      });
      tl.fromTo("#v01-t4", { opacity: 0, rotation: -4, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.12, ease: "none" }, 5.22);
      tl.to("#v01-t4", { opacity: 0.25, duration: 0.06, ease: "none" }, 5.36);
      tl.to("#v01-t4", { opacity: 1, duration: 0.06, ease: "none" }, 5.44);
      tl.to("#v01-t4", { opacity: 0.4, duration: 0.05, ease: "none" }, 5.56);
      tl.to("#v01-t4", { opacity: 1, duration: 0.08, ease: "none" }, 5.62);

      tl.fromTo("#v01-n1", { x: 80, opacity: 0, rotation: -2 }, { x: 0, opacity: 1, rotation: -2, duration: 0.5, ease: "expo.out" }, 4.3);
      [["#v01-b1", 6.32], ["#v01-b2", 6.46], ["#v01-b3", 6.6]].forEach(([b, c]) => {
        tl.fromTo(b, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, c);
      });
      [["#v01-n2", 6.38, 3], ["#v01-n5", 6.62, -3], ["#v01-n3", 6.86, -4], ["#v01-n4", 7.08, 2]].forEach(([n, c, r]) => {
        tl.fromTo(n, { x: 90, opacity: 0, rotation: r }, { x: 0, opacity: 1, rotation: r, duration: 0.42, ease: "expo.out" }, c);
      });
      tl.fromTo("#v01-verdict", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.4);

      const jitter = [[6, -4], [-8, 5], [5, 7], [-9, -6], [10, 3], [-6, 9], [11, -8], [-12, 4], [9, 10], [-13, -9], [14, 6], [-10, -12], [12, 11], [-15, 5]];
      jitter.forEach(([dx, dy], i) => {
        const k = 0.45 + i / jitter.length * 0.9;
        tl.to("#v01-cluster", { x: dx * k, y: dy * k, duration: 0.07, ease: "none" }, 6.3 + i * 0.08);
      });
      tl.to("#v01-cluster", { x: 0, y: 0, duration: 0.06, ease: "none" }, 7.42);

      ["#v01-t1", "#v01-t2", "#v01-t3", "#v01-t4", "#v01-n1", "#v01-n2", "#v01-n3", "#v01-n4", "#v01-n5"].forEach((sel, i) => {
        const el = document.querySelector(sel);
        const cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
        tl.to(sel, { x: 540 - cx, y: 960 - cy, scale: 0.05, rotation: (i % 2 ? 40 : -40), opacity: 0, duration: 0.38, ease: "power3.in" }, 7.5 + i * 0.012);
      });
      tl.to(words.concat(["#v01-verdict", "#v01-kicker"]), { opacity: 0, x: 120, filter: "blur(10px)", duration: 0.34, ease: "power3.in", stagger: 0.02 }, 7.52);

      window.__timelines["01-chaos"] = tl;
    })();
  </script>
