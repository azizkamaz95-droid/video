    #v04-screen img { position: absolute; left: 0; top: 0; width: 268px; height: 529px; object-fit: cover; object-position: 50% 0%; }

  <div id="root" data-composition-id="04-sport" data-width="1080" data-height="1920" data-duration="8.5">

      <div id="v04-shade"></div>
      <div id="v04-top" class="mono"><span>CaliBodi</span><span class="r"><b>01</b> / 04 · Sport</span></div>

      <div id="v04-kicker" class="mono">01 — Sport</div>

      <div id="v04-labA" class="cardlab mono" style="left:80px; top:1146px;">Genoux</div>
      <div id="v04-cardB" class="card" style="left:330px; top:1010px;"><video id="v04-vB" class="clip" src="assets/exercises/squat.mp4" muted playsinline data-start="0" data-duration="8.5" data-track-index="3"></video></div>
      <div id="v04-labB" class="cardlab mono" style="left:330px; top:1196px;">Squat</div>
      <div id="v04-cardC" class="card" style="left:150px; top:1240px;"><video id="v04-vC" class="clip" src="assets/exercises/pushup.mp4" muted playsinline data-start="0" data-duration="8.5" data-track-index="4"></video></div>

        <div class="av"><svg viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const segs = document.getElementById("v04-segs");
      for (let i = 0; i < 10; i++) {
        const s = document.createElement("div");
        s.className = "seg"; s.style.left = (i * 70) + "px";
        s.innerHTML = `<i id="v04-sg${i}"></i>`;
        segs.appendChild(s);
      }
      const wave = document.getElementById("v04-wave");
      for (let i = 0; i < 12; i++) {
        const b = document.createElement("b");
        b.id = `v04-wb${i}`; b.style.left = (i * 9) + "px";
        wave.appendChild(b);
      }

      tl.fromTo("#v04-photo img", { scale: 1.12 }, { scale: 1.0, duration: 8.5, ease: "none" }, 0);
      tl.fromTo("#v04-progfill", { scaleX: 0 }, { scaleX: 1, duration: 8.5, ease: "none", transformOrigin: "0% 50%" }, 0);
      tl.fromTo(["#v04-top", "#v04-rule"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);

      tl.fromTo("#v04-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.2);
      tl.fromTo("#v04-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.42);
      tl.fromTo("#v04-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.78);
      tl.set(["#v04-l3", "#v04-l4"], { yPercent: 110 }, 0);

      tl.fromTo("#v04-phone", { y: 260, rotation: 7, opacity: 0 }, { y: 0, rotation: 3, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.25);
      tl.to("#v04-phone", { y: -14, duration: 2.0, ease: "sine.inOut" }, 1.3);
      tl.to("#v04-phone", { y: 6, duration: 2.6, ease: "sine.inOut" }, 3.3);
      tl.to("#v04-phone", { y: -10, duration: 2.5, ease: "sine.inOut" }, 5.9);

      [["#v04-cardA", "#v04-labA", 0.9, -8], ["#v04-cardB", "#v04-labB", 1.15, 6], ["#v04-cardC", "#v04-labC", 1.4, -5]].forEach(([c, l, t, r]) => {
        tl.fromTo(c, { scale: 0.4, opacity: 0, rotation: r * 2 }, { scale: 1, opacity: 1, rotation: r, duration: 0.7, ease: "back.out(1.6)" }, t);
        tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, t + 0.3);
        tl.to(c, { y: -12, duration: 1.6, ease: "sine.inOut" }, t + 0.7);
        tl.to([c, l], { opacity: 0, scale: 0.6, y: 40, duration: 0.4, ease: "power3.in" }, 4.3);
      });

      [["#v04-chip1", 1.82], ["#v04-chip2", 2.43], ["#v04-chip3", 3.2]].forEach(([c, t]) => {
        tl.fromTo(c, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t);
      });

      tl.to(["#v04-chip1", "#v04-chip2", "#v04-chip3"], { opacity: 0, x: -30, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 4.32);
      tl.to("#v04-l1", { yPercent: -110, duration: 0.45, ease: "power3.in" }, 4.3);
      tl.to("#v04-l2", { yPercent: -110, duration: 0.45, ease: "power3.in" }, 4.36);
      tl.to("#v04-l3", { yPercent: -100, duration: 0.7, ease: "expo.out" }, 4.62);
      tl.to("#v04-l4", { yPercent: -100, duration: 0.7, ease: "expo.out" }, 6.12);

      tl.fromTo("#v04-scr2", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "expo.inOut" }, 4.4);
      tl.fromTo("#v04-calix", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 4.55);
      for (let i = 0; i < 12; i++) {
        tl.set(`#v04-wb${i}`, { scaleY: 0.15, transformOrigin: "50% 100%" }, 0);
        for (let k = 0; k < 14; k++) {
          const h = 0.2 + 0.8 * Math.abs(Math.sin(i * 1.7 + k * 2.3)) * (0.55 + 0.45 * Math.abs(Math.sin(k * 0.9)));
          tl.to(`#v04-wb${i}`, { scaleY: h, duration: 0.12, ease: "sine.inOut" }, 4.7 + k * 0.12);
        }
        tl.to(`#v04-wb${i}`, { scaleY: 0.15, duration: 0.2, ease: "sine.out" }, 4.7 + 14 * 0.12);
      }

      tl.fromTo("#v04-reps", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 5.2);
      for (let i = 0; i < 10; i++) tl.set(`#v04-sg${i}`, { scaleX: 0, transformOrigin: "0% 50%" }, 0);
      for (let i = 0; i < 7; i++) tl.to(`#v04-sg${i}`, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 5.3 + i * 0.05);
      const num = document.getElementById("v04-repnum");
      const counts = [[6.28, 8], [6.62, 9], [7.0, 10]];
      const rep = { v: 7 };
      const paint = () => { num.textContent = String(Math.round(rep.v)).padStart(2, "0"); };
      counts.forEach(([t, v]) => {
        tl.fromTo(rep, { v: v - 1 }, { v, duration: 0.01, ease: "none", onUpdate: paint, immediateRender: false }, t);
        tl.fromTo("#v04-repnum", { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "back.out(2)", transformOrigin: "0% 60%", immediateRender: false }, t);
        tl.to(`#v04-sg${v - 1}`, { scaleX: 1, duration: 0.2, ease: "power2.out" }, t);
      });
      tl.fromTo("#v04-done", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 7.15);

      window.__timelines["04-sport"] = tl;
    })();
  </script>
</template>
